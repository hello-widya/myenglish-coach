<html lang="id">
<head>

<title>English Coach</title>
<style>
:root{--bg:#f7f6f3;--panel:#fff;--panel2:#f0eee9;--text:#26242b;--muted:#7b7683;--line:#e7e3dc;--accent:#5b5fc7;--accent2:#e8e9fa;--ok:#3d8b65;--bad:#c25456;--warn:#fff4e0;--shadow:0 6px 20px rgba(40,35,60,.06)}

:root[data-theme="dark"]{--bg:#16151a;--panel:#201e26;--panel2:#2b2933;--text:#efedf3;--muted:#a49fae;--line:#38353f;--accent:#8f93f0;--accent2:#2d2e4a;--ok:#6fc29a;--bad:#e28486;--warn:#3a3020;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:720px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
.logo{font-weight:800;letter-spacing:.2px}
.chips{display:flex;gap:8px;font-size:12px}
.chips span{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px 10px;color:var(--muted)}
main{padding-top:16px;padding-bottom:16px}
h2{font-size:20px;margin:6px 0 4px}h3{font-size:16px;margin:0 0 6px}h4{font-size:13px;margin:16px 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
p{margin:6px 0}
.muted,small{color:var(--muted)}
small{display:block;font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px;box-shadow:var(--shadow)}
.hero{text-align:center;padding:22px 16px}
.hero .big{font-size:52px;font-weight:800;line-height:1;color:var(--accent)}
.btn{border:0;background:var(--accent);color:#fff;padding:12px 18px;border-radius:12px;font:inherit;font-weight:700;cursor:pointer;min-height:44px}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.danger{background:var(--bad)}
.btn.sm{padding:6px 12px;font-size:14px;min-height:36px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.pill{display:inline-block;background:var(--accent2);color:var(--text);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600}
.pill.ok{background:rgba(61,139,101,.15);color:var(--ok)}
.note{background:var(--accent2);border-radius:12px;padding:12px 14px;font-size:14px;margin:0 0 14px}
.note.warn{background:var(--warn)}
.note a{color:var(--accent);font-weight:700}
input,select,textarea{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:150px;resize:vertical}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 4px}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.seg button{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:99px;padding:7px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.item{padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.ico{width:40px;height:40px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;font-size:20px;flex:none}
.chev{color:var(--muted);font-size:22px}
.phrase{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.phrase:last-of-type{border-bottom:0}
.fc{min-height:220px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:var(--accent2);border-radius:16px;padding:22px;margin:10px 0;white-space:pre-wrap}
.fc .t{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.fc .f{font-size:22px;font-weight:700}
.fc .b{font-size:18px;margin-top:10px}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.rate .btn{display:flex;flex-direction:column;align-items:center;gap:0}
.rate small{color:inherit;opacity:.85;font-size:11px;font-weight:400}
.ans{background:var(--panel2);border-radius:12px;padding:12px;margin:6px 0;white-space:pre-wrap}
.err{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.err .w{color:var(--bad);text-decoration:line-through}
.err .r{color:var(--ok);font-weight:700}
.q{border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;font:inherit;color:var(--text);cursor:pointer}
.opt.good{border-color:var(--ok);background:rgba(61,139,101,.14)}
.opt.bad{border-color:var(--bad);background:rgba(194,84,86,.14)}
.why{font-size:14px;color:var(--muted);margin-top:6px}
.w-ok{color:var(--ok);font-weight:700}.w-bad{color:var(--bad);font-weight:700;text-decoration:underline}
.bars{display:flex;gap:6px;align-items:flex-end;height:46px;margin-top:8px}
.bars i{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:3px;opacity:.85}
.bars span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
#micBtn.on{background:var(--bad);color:#fff;border-color:var(--bad)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);z-index:10;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav div{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{border:0;background:transparent;color:var(--muted);padding:9px 2px 8px;font:inherit;font-size:11px;cursor:pointer;display:grid;gap:1px;justify-items:center}
nav button b{font-size:20px;line-height:1.1}
nav button.on{color:var(--accent);font-weight:700}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:grid;place-items:center;padding:16px}#dlg[hidden]{display:none}.dbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;max-width:380px;width:100%}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
a{color:var(--accent)}
.link{display:block;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.link:last-child{border-bottom:0}
</style>
</head>

function seedIfNeeded(){if(S.seeded)return;S.cards=SEED.map(s=>({id:uid(),front:s[0],back:s[1],example:s[2],tag:s[3],kind:'phrase',say:s[0],box:0,due:today(),created:today(),lapses:0}));S.seeded=true;save()}

/* ============ Kartu & SRS ============ */
const INT=[0,1,3,7,14,30];
function focusOk(c){return S.focus==='all'||c.tag===S.focus||c.tag==='koreksi'}
function dueCards(){return S.cards.filter(c=>c.due<=today()&&focusOk(c)).sort((a,b)=>a.box-b.box||(a.due<b.due?-1:1))}
function cardById(id){return S.cards.find(c=>c.id===id)}
function nextState(c,r){let box=c.box;if(r==='again')box=0;else if(r==='good')box=Math.min(5,box+1);else box=Math.max(1,box);const days=r==='again'?0:r==='hard'?Math.max(1,Math.ceil(INT[box]/2)):INT[box];return {box,days}}
function rateCard(c,r){const n=nextState(c,r);c.box=n.box;c.due=addDays(today(),n.days);if(r==='again')c.lapses=(c.lapses||0)+1}
function addCard(o){const f=String(o.front||'').trim(),b=String(o.back||'').trim();if(!f||!b)return false;if(S.cards.some(c=>c.kind===(o.kind||'phrase')&&c.front.toLowerCase()===f.toLowerCase()))return false;S.cards.push({id:uid(),front:f,back:b,example:String(o.example||'').trim(),tag:o.tag||'umum',kind:o.kind||'phrase',say:o.say||'',box:0,due:today(),created:today(),lapses:0});return true}
function streak(){const a=new Set(S.activity);let d=today();if(!a.has(d))d=addDays(d,-1);let n=0;while(a.has(d)){n++;d=addDays(d,-1)}return n}
function mark(){const t=today();if(!S.activity.includes(t)){S.activity.push(t);if(S.activity.length>400)S.activity.shift();save()}}

/* ============ Suara ============ */
function speak(t,rate){if(!('speechSynthesis' in window))return toast('Suara tidak didukung browser ini.');try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=S.accent;u.rate=rate||S.rate;const vs=speechSynthesis.getVoices();const v=vs.find(v=>v.lang.replace('_','-')===S.accent)||vs.find(v=>v.lang.startsWith('en'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){toast('Suara gagal diputar.')}}
let rec=null;
function mergeSpeech(list){const out=[];list.forEach(t=>{t=String(t||'').trim();if(!t)return;const last=out[out.length-1];if(last&&t.toLowerCase().startsWith(last.toLowerCase()))out[out.length-1]=t;else if(last&&last.toLowerCase().startsWith(t.toLowerCase())){}else out.push(t)});return out.join(' ')}
function toggleMic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('Pengenalan suara belum didukung browser ini. Coba Chrome.');if(rec){rec.stop();return}
 const ta=$('#draft');if(!ta)return;rec=new SR();rec.lang=S.accent;rec.interimResults=true;rec.continuous=false;
 const base=ta.value.trim()?ta.value.trim()+' ':'';
 rec.onresult=e=>{const parts=[];for(let i=0;i<e.results.length;i++)parts.push(e.results[i][0].transcript);ta.value=(base+mergeSpeech(parts)).trim();ui.draft=ta.value};
 rec.onerror=e=>{if(e.error!=='no-speech'&&e.error!=='aborted')toast('Mikrofon: '+e.error)};
 rec.onend=()=>{rec=null;const b=$('#micBtn');if(b)b.classList.remove('on');mark();toast('Tekan 🎙 lagi untuk lanjut bicara.')};
 try{rec.start();$('#micBtn').classList.add('on')}catch(e){rec=null}}

/* ============ AI ============ */
function provById(id){return S.providers.find(p=>p.id===id)}
function defProv(){return provById(S.defaultProvider)||S.providers[0]||null}
function usedToday(p){return ((S.usage[today()]||{})[p.id])||0}
function bump(p){const t=today();S.usage[t]=S.usage[t]||{};S.usage[t][p.id]=(S.usage[t][p.id]||0)+1;const old=addDays(t,-30);Object.keys(S.usage).forEach(k=>{if(k<old)delete S.usage[k]})}
function parseJSON(t){t=String(t||'').replace(/^\s*```(?:json)?\s*/i,'').replace(/```\s*$/,'').trim();const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<=a)return null;try{return JSON.parse(t.slice(a,b+1))}catch(e){return null}}
const NETERR='Tidak bisa terhubung. Cek internet dan URL provider. Jika ini dibuka di pratinjau/halaman chat, koneksi keluar diblokir di sana: buka file langsung di Chrome atau Edge.';
async function callAI(p,system,user,opt){opt=opt||{};
 if(!p||!p.key||!p.model||!p.url)throw new Error('Lengkapi provider di Pengaturan (URL, key, dan model ID).');
 const ck=hash(p.model+'|'+system+'|'+user);const cache=loadCache();
 if(!opt.noTrack&&cache[ck])return {text:cache[ck].v,cached:true};
 if(!opt.noTrack&&p.limit&&usedToday(p)>=p.limit)throw new Error('Batas harian untuk "'+p.name+'" tercapai ('+p.limit+'). Pilih model lain atau ubah batas di Pengaturan.');
 let text='';
 if(p.format==='gemini'){
  const url=p.url.replace(/\/$/,'')+'/models/'+encodeURIComponent(p.model)+':generateContent?key='+encodeURIComponent(p.key);
  const body={systemInstruction:{parts:[{text:system}]},contents:[{role:'user',parts:[{text:user}]}],generationConfig:{temperature:0.3,maxOutputTokens:opt.max||4096,responseMimeType:opt.json?'application/json':undefined}};
  let res;try{res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}catch(e){throw new Error(NETERR)}
  let data={};try{data=await res.json()}catch(e){}
  if(!res.ok)throw new Error(errMsg(res.status,data));
  text=((data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts)||[]).map(x=>x.text||'').join('');
  if(!text)throw new Error('AI tidak mengembalikan teks'+(data.candidates&&data.candidates[0]&&data.candidates[0].finishReason?' ('+data.candidates[0].finishReason+')':'')+'. Coba lagi.');
 }else{
  const url=p.url.replace(/\/$/,'')+'/chat/completions';
  const body={model:p.model,messages:[{role:'system',content:system},{role:'user',content:user}],temperature:0.3,max_tokens:opt.max||4096};
  let res;try{res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+p.key},body:JSON.stringify(body)})}catch(e){throw new Error(NETERR)}
  let data={};try{data=await res.json()}catch(e){}
  if(!res.ok)throw new Error(errMsg(res.status,data));
  text=(data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content)||'';
  if(!text)throw new Error('AI tidak mengembalikan teks. Coba lagi.');
 }
 if(!opt.noTrack){bump(p);save();let ok=true;if(opt.validate){try{opt.validate(text)}catch(e){ok=false}}if(ok){cache[ck]={t:Date.now(),v:text};saveCache(cache)}}
 return {text,cached:false}}
function errMsg(status,data){const m=(data&&data.error&&(data.error.message||data.error))||'';let h='';if(status===429)h=' Kuota atau limit model ini habis. Pilih model lain atau tunggu reset.';else if(status===400&&/api key/i.test(m))h=' Periksa API key.';else if(status===401||status===403)h=' Periksa API key dan izin model.';else if(status===404)h=' Periksa Model ID dan Base URL.';return 'Permintaan gagal ('+status+').'+h+(m?' '+String(m).slice(0,160):'')}
async function aiJSON(p,sys,user,max){
 const v=t=>{const o=parseJSON(t);if(!o||typeof o!=='object')throw new Error('bad');return o};
 let r=await callAI(p,sys,user,{json:true,max:max,validate:v});
 try{return {data:v(r.text),cached:r.cached}}catch(e){}
 r=await callAI(p,sys,user+'\n\nIMPORTANT: Return ONLY one valid JSON object. No markdown, no extra text.',{json:true,max:max,validate:v});
 try{return {data:v(r.text),cached:r.cached}}catch(e){throw new Error('Format jawaban AI tidak bisa dibaca. Coba lagi atau pilih model lain.')}}

function modelSelect(){if(!S.providers.length)return '';const cur=(ui.model&&provById(ui.model))?ui.model:(defProv()||{}).id;return `<label>Model AI</label><select id="modelSel">${S.providers.map(p=>`<option value="${p.id}" ${p.id===cur?'selected':''}>${esc(p.name)} · ${esc(p.model)} (${usedToday(p)}${p.limit?'/'+p.limit:''})</option>`).join('')}</select>`}

function reviewHTML(){const rv=ui.rv;const c=cardById(rv.queue[rv.i]);

function quizBoxHTML(){const q=ui.quiz,d=q.data;const ans=q.ans;const done=Object.keys(ans).length;const correct=Object.values(ans).filter(a=>a.ok).length;
 return `<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${esc(d.title||'Soal')}</h3><span class="pill">${correct}/${done} benar · ${d.questions.length} soal</span></div>

function qHTML(x,i,q){const a=q.ans[i];let inner='';
 if(x.type==='mcq'){inner=(x.options||[]).map((o,j)=>{let cls='';if(a){if(j===x.answer)cls='good';else if(j===a.v)cls='bad'}return `<button class="opt ${cls}" data-act="qa" data-i="${i}" data-v="${j}" ${a?'disabled':''}>${esc(o)}</button>`}).join('')}
 else if(x.type==='tf'){inner=[[true,'True'],[false,'False']].map(o=>{let cls='';if(a){if(o[0]===x.answer)cls='good';else if(o[0]===a.v)cls='bad'}return `<button class="opt ${cls}" data-act="qa" data-i="${i}" data-v="${o[0]}" ${a?'disabled':''}>${o[1]}</button>`}).join('')}
 else{const dv=q.draft[i]||'';inner=a?`<div class="opt ${a.ok?'good':'bad'}">${esc(a.v)}</div>${a.ok?'':`<div class="opt good">${esc(x.answer)}</div>`}`:`<div class="row"><input data-fill="${i}" value="${esc(dv)}" placeholder="Jawabanmu" style="flex:1"><button class="btn sm" data-act="qf" data-i="${i}">Cek</button></div>`}
 return `<div class="q"><b>${i+1}. ${esc(x.q)}</b>${inner}${a?`<div class="why">${a.ok?'✓ Benar. ':'✗ '}${esc(x.why||'')}</div>`:''}</div>`}

function dictHTML(){if(!ui.dict)pickDict();const d=ui.dict;
 let res='';if(d.res){res=`<div class="card"><p class="${d.res.score===d.res.total?'w-ok':''}">Skor: ${d.res.score}/${d.res.total} kata</p><p>${d.res.words.map((w,i)=>`<span class="${d.res.ok[i]?'w-ok':'w-bad'}">${esc(w)}</span>`).join(' ')}</p><small>Hijau = tertulis benar, merah = terlewat/salah.</small></div>`}
 return `<div class="card"><h3>Dikte (tanpa AI)</h3><p class="muted">Dengarkan kalimat, lalu ketik apa yang kamu dengar. Gratis, tidak memakai kuota.</p>

function pickDict(){const pool=[].concat(LESSONS.flatMap(l=>l.phrases.map(x=>x[0])),S.cards.map(c=>c.example)).filter(s=>s&&s.split(/\s+/).length>=4&&s.indexOf('...')<0);ui.dict={t:rand(pool),res:null}}
function diffWords(target,ans){const norm=s=>s.toLowerCase().replace(/[^a-z0-9' ]/g,' ').split(/\s+/).filter(Boolean);const a=norm(target),b=norm(ans);const n=a.length,m=b.length;const dp=Array.from({length:n+1},()=>Array(m+1).fill(0));for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);const ok=Array(n).fill(false);let i=0,j=0;while(i<n&&j<m){if(a[i]===b[j]){ok[i]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}return {words:a,ok,score:ok.filter(Boolean).length,total:n}}

 try{const r=await aiJSON(p,SYS_QUIZ,'Level: '+ui.qlevel+'\nTopic focus: '+ui.qcat+'\nNumber of questions: '+ui.qn+'\nMix mcq, tf and fill. Questions in English at the stated level. Give 4-6 vocab items.\nMaterial:\n'+src.slice(0,6000),6000);
  const d=r.data;d.questions=(Array.isArray(d.questions)?d.questions:[]).filter(q=>q&&q.q&&(q.type==='fill'||q.type==='tf'||(q.type==='mcq'&&Array.isArray(q.options)&&q.options.length>=2)));
  if(!d.questions.length)throw new Error('Soal tidak terbentuk. Coba lagi dengan teks lain.');
  d.vocab=(Array.isArray(d.vocab)?d.vocab:[]).filter(v=>v&&v.front&&v.back);
  ui.quiz={data:d,ans:{},draft:{}};
  if(!r.cached){S.quizzes.unshift({id:uid(),date:today(),data:d});S.quizzes=S.quizzes.slice(0,15);save()}
  mark();$('#quizBox').innerHTML=quizBoxHTML();chrome();
 }catch(e){$('#quizBox').innerHTML='<div class="note warn">'+esc(e.message)+'</div>'}
 ui.busy=false};
function refreshQuiz(){document.querySelectorAll('[data-fill]').forEach(i=>{ui.quiz.draft[i.dataset.fill]=i.value});$('#quizBox').innerHTML=quizBoxHTML()}
const normA=s=>String(s).toLowerCase().replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim();
A.qa=(d)=>{const q=ui.quiz,i=+d.i,x=q.data.questions[i];if(q.ans[i])return;let v,ok;if(x.type==='mcq'){v=+d.v;ok=v===+x.answer}else{v=d.v==='true';ok=v===(x.answer===true||x.answer==='true')}q.ans[i]={v,ok};mark();refreshQuiz()};
A.qf=(d)=>{const q=ui.quiz,i=+d.i,x=q.data.questions[i];const inp=document.querySelector('[data-fill="'+i+'"]');const v=(inp?inp.value:'').trim();if(!v)return toast('Isi jawabannya dulu.');const acc=[x.answer].concat(x.accept||[]).map(normA);q.ans[i]={v,ok:acc.indexOf(normA(v))>=0};mark();refreshQuiz()};
A.quizSaveWrong=()=>{const q=ui.quiz;let n=0;q.data.questions.forEach((x,i)=>{const a=q.ans[i];if(!a||a.ok)return;let ans=x.type==='mcq'?(x.options||[])[x.answer]:x.type==='tf'?String(x.answer):x.answer;if(addCard({front:x.q,back:String(ans)+'\n'+(x.why||''),tag:'koreksi',kind:'fix',say:x.type==='fill'?String(x.q).replace(/_+/,String(ans)):''}))n++});save();toast(n?n+' kartu ditambahkan.':'Tidak ada soal salah yang baru.')};
A.quizVocab=(d)=>{const v=ui.quiz.data.vocab[+d.i];const ok=addCard({front:v.front,back:v.back,example:v.example,tag:ui.qcat,say:v.front});save();toast(ok?'Jadi kartu.':'Sudah ada.')};
A.quizOpen=(d)=>{const x=S.quizzes[+d.i];if(!x)return;ui.quiz={data:clone(x.data),ans:{},draft:{}};render();const b=$('#quizBox');if(b)b.scrollIntoView({behavior:'smooth'})};
A.dictPlay=()=>speak(ui.dict.t);
A.dictSlow=()=>speak(ui.dict.t,0.6);
A.dictNext=()=>{pickDict();render()};
A.dictCheck=()=>{const a=($('#dans')||{}).value||'';if(!a.trim())return toast('Ketik dulu yang kamu dengar.');ui.dict.res=diffWords(ui.dict.t,a);mark();const keep=a;render();$('#dans').value=keep};
/* provider */
const PRESET={gemini:{name:'Gemini',url:'https://generativelanguage.googleapis.com/v1beta',format:'gemini'},openai:{name:'',url:'',format:'openai'}};
A.pfNew=(d)=>{const pr=PRESET[d.k];const prevKey=(S.providers.find(p=>p.format===pr.format)||{}).key||'';ui.pf={id:null,name:pr.name,url:pr.url,format:pr.format,key:prevKey,model:'',limit:d.k==='gemini'?'400':''};render()};
A.pfEdit=(d)=>{const p=provById(d.id);ui.pf={id:p.id,name:p.name,url:p.url,format:p.format,key:p.key,model:p.model,limit:p.limit||''};render()};
A.pfClose=()=>{ui.pf=null;render()};
A.pfUse=(d)=>{S.defaultProvider=d.id;save();render()};
A.pfDel=(d)=>ask('Hapus provider ini beserta API key-nya dari browser?',()=>{S.providers=S.providers.filter(p=>p.id!==d.id);if(S.defaultProvider===d.id)S.defaultProvider=S.providers[0]?S.providers[0].id:null;save();render()});
function readPf(){return {name:$('#pfName').value.trim(),format:$('#pfFormat').value,url:$('#pfUrl').value.trim(),key:$('#pfKey').value.trim(),model:$('#pfModel').value.trim(),limit:Math.max(0,parseInt($('#pfLimit').value,10)||0)}}
A.pfSave=()=>{const v=readPf();const miss=[];if(!v.url)miss.push('Base URL');if(!v.key)miss.push('API key');if(!v.model)miss.push('Model ID');
 if(miss.length){const m='Belum diisi: '+miss.join(', ');const el=$('#pfMsg');if(el)el.textContent=m;return toast(m)}
 if(!v.name)v.name=v.model;const f=ui.pf;if(f.id){const p=provById(f.id);Object.assign(p,v)}else{const p=Object.assign({id:uid()},v);S.providers.push(p);if(!S.defaultProvider)S.defaultProvider=p.id}ui.pf=null;save();toast('Provider disimpan.');render()};
A.pfTest=async()=>{const v=readPf();const m=$('#pfMsg');if(!v.url||!v.key||!v.model)return toast('Isi URL, key, dan model dulu.');m.textContent='Menguji… (1 request)';
 try{const r=await callAI(Object.assign({id:'tmp'},v),'You are a connection test.','Reply with the single word: OK',{noTrack:true,max:256});m.textContent='Berhasil: '+r.text.slice(0,60)}catch(e){m.textContent='Gagal: '+e.message}};
A.export=()=>{const o=clone(S);if(!$('#incKey').checked)o.providers=o.providers.map(p=>Object.assign({},p,{key:''}));ui.exportText=JSON.stringify(o,null,2);try{const b=new Blob([ui.exportText],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='english-coach-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(e){}render();setTimeout(()=>{const t=$('#expBox');if(t)t.scrollIntoView({behavior:'smooth'})},0)};
A.copyExport=()=>{const t=$('#expBox');if(!t)return;t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('Tersalin.'),()=>toast('Pilih teks lalu salin manual.'))}catch(e){toast('Pilih teks lalu salin manual.')}};
A.importPaste=()=>{const v=(($('#impText')||{}).value||'').trim();try{const o=JSON.parse(v);if(!o||typeof o!=='object'||!Array.isArray(o.cards))throw new Error('x');const old=S.providers;const n=Object.assign(clone(DEF),o);n.providers=(n.providers||[]).map(p=>{if(!p.key){const m=old.find(x=>x.id===p.id);if(m)p.key=m.key}return p});S=n;save();applyTheme();toast('Backup diimpor.');render()}catch(err){toast('Teks backup tidak valid.')}};
A.importPick=()=>$('#impFile').click();
A.reset=()=>ask('Hapus SEMUA data (kartu, tulisan, provider, key)? Tidak bisa dibatalkan.',()=>{try{localStorage.removeItem(LS);localStorage.removeItem(LSC)}catch(e){}S=clone(DEF);seedIfNeeded();ui.pf=null;ui.exportText='';ui.result=null;ui.quiz=null;render();toast('Data dihapus.')});

document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=A[t.dataset.act];if(!f)return;if(t.tagName==='A')e.preventDefault();f(t.dataset,t)});
document.addEventListener('input',e=>{const id=e.target.id;if(id==='draft')ui.draft=e.target.value;else if(id==='qsrc')ui.quizSrc=e.target.value});
document.addEventListener('change',e=>{const el=e.target,id=el.id;
 if(id==='modelSel')ui.model=el.value;
 else if(id==='wtype'){ui.draft=($('#draft')||{}).value||ui.draft;ui.wtype=el.value;ui.topic='';render()}
 else if(id==='qlevel')ui.qlevel=el.value;else if(id==='qn')ui.qn=el.value;else if(id==='qcat')ui.qcat=el.value;
 else if(id==='setAccent'){S.accent=el.value;save()}
 else if(id==='setRate'){S.rate=parseFloat(el.value);save()}
 else if(id==='setTheme'){S.theme=el.value;save();applyTheme()}
 else if(id==='impFile'){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||typeof o!=='object'||!Array.isArray(o.cards))throw new Error('x');const old=S.providers;const n=Object.assign(clone(DEF),o);n.providers=(n.providers||[]).map(p=>{if(!p.key){const m=old.find(x=>x.id===p.id);if(m)p.key=m.key}return p});S=n;save();applyTheme();toast('Backup diimpor.');render()}catch(err){toast('File backup tidak valid.')}};r.readAsText(f);el.value=''}});
if('speechSynthesis' in window){try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}}
seedIfNeeded();applyTheme();render();
</script>
</body>
</html>
