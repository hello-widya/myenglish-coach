<style>
:root{
  --bg:#f3eee4; --bg-2:#e7f0ea; --paper:#fffdf8; --ink:#1c1915; --muted:#5e574c;
  --line:#e4d9c8; --forest:#1b4332; --forest-2:#2d6a4f; --gold:#8d6430; --gold-2:#f3e6cf;
  --ok:#1a6b42; --bad:#8f2f2a; --warn:#f6e7c8; --btn:#1b4332; --btn-ink:#f7f3eb;
  --shadow:0 10px 30px rgba(60,40,10,.06); --serif:"Fraunces","Iowan Old Style",Palatino,"Liberation Serif","DejaVu Serif",Georgia,serif;
  --sans:"Outfit","Avenir Next","Segoe UI","Liberation Sans","DejaVu Sans",system-ui,sans-serif;
  --h0:#e6dece; --h1:#c5dccb; --h2:#7eae8e; --h3:#3d7a58; --h4:#1b4332;
  --sidebar:#1b4332; --side-fg:#f6f1e7; --side-muted:#d5e4d6; --radius:18px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#121512; --bg-2:#1a2420; --paper:#1c211d; --ink:#f4efe6; --muted:#b7afa2;
  --line:#31382f; --forest:#e4c07a; --forest-2:#8fbc8f; --gold:#e4c07a; --gold-2:#3a3224;
  --ok:#8dcea8; --bad:#f0a8a2; --warn:#3a3224; --btn:#e4c07a; --btn-ink:#1c160d;
  --shadow:none; --h0:#2a312c; --h1:#1e4634; --h2:#2f6b4c; --h3:#6eaa84; --h4:#e4c07a;
  --sidebar:#0e120f; --side-fg:#f4efe6; --side-muted:#b7c4b8;
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121512; --bg-2:#1a2420; --paper:#1c211d; --ink:#f4efe6; --muted:#b7afa2;
    --line:#31382f; --forest:#e4c07a; --forest-2:#8fbc8f; --gold:#e4c07a; --gold-2:#3a3224;
    --ok:#8dcea8; --bad:#f0a8a2; --warn:#3a3224; --btn:#e4c07a; --btn-ink:#1c160d;
    --shadow:none; --h0:#2a312c; --h1:#1e4634; --h2:#2f6b4c; --h3:#6eaa84; --h4:#e4c07a;
    --sidebar:#0e120f; --side-fg:#f4efe6; --side-muted:#b7c4b8;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:#e7dcc8; color:var(--ink);
  font:16px/1.5 var(--sans); padding-bottom:calc(78px + env(safe-area-inset-bottom,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:8}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
.shell{min-height:100dvh; background:var(--bg)}
.side{display:none}
.stage{min-width:0}
.top{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:14px 16px 12px; position:sticky; top:env(safe-area-inset-top,0px); z-index:6;
  background:color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter:blur(12px);
  border-bottom:1px solid transparent;
}
.brandmark{font-family:var(--serif); font-weight:560; font-size:22px; letter-spacing:-.03em; line-height:1}
.brandmark i{font-style:italic; color:var(--gold)}
.top-meta{display:flex; align-items:center; gap:8px; margin-left:auto}
.chip{font-size:12px; font-weight:600; color:var(--muted); background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:4px 10px; white-space:nowrap}
.iconbtn{width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:var(--paper); display:grid; place-items:center; color:var(--ink)}
.iconbtn.on{background:var(--forest); color:var(--btn-ink); border-color:transparent}
main{padding:8px 16px 28px}
h1{font-family:var(--serif); font-weight:560; font-size:40px; line-height:1.05; letter-spacing:-.03em; margin:0 0 8px}
h1 em{font-style:italic; font-weight:560}
h2{font-family:var(--serif); font-weight:560; font-size:34px; line-height:1.1; letter-spacing:-.03em; margin:0 0 6px}
h3{font-size:16px; margin:0 0 6px; letter-spacing:-.01em}
h4{font-size:12px; margin:16px 0 6px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; font-weight:700}
p{margin:6px 0}
.kicker{font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); margin:0 0 8px}
.lede{color:var(--muted); margin:0 0 16px; max-width:46ch}
.muted,small{color:var(--muted)}
small{display:block; font-size:13px; line-height:1.4}
.card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin:0 0 14px; box-shadow:var(--shadow)}
.card h3{font-family:var(--serif); font-size:22px; font-weight:560}
.stats{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:0 0 14px}
.stat{background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:14px 14px 12px}
.stat b{display:block; font-family:var(--serif); font-size:32px; font-weight:560; letter-spacing:-.03em; line-height:1}
.stat span{color:var(--muted); font-size:12px; font-weight:600}
.split{display:grid; gap:14px}
.btn{border:0; background:var(--btn); color:var(--btn-ink); padding:12px 16px; border-radius:12px; font-weight:650; min-height:44px; display:inline-flex; align-items:center; justify-content:center; gap:8px}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line)}
.btn.soft{background:var(--gold-2); color:var(--ink)}
.btn.danger{background:var(--bad); color:#fff}
.btn.sm{padding:7px 12px; min-height:36px; font-size:14px; font-weight:600}
.btn.block{width:100%}
.btn[disabled]{opacity:.45; cursor:default}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.grow{flex:1; min-width:0}
.pill{display:inline-flex; align-items:center; background:var(--bg-2); color:var(--ink); border-radius:999px; padding:2px 8px; font-size:12px; font-weight:650}
.pill.ok{background:color-mix(in srgb, var(--ok) 16%, transparent); color:var(--ok)}
.note{background:var(--bg-2); border-radius:14px; padding:12px 14px; font-size:14px; margin:0 0 14px}
.note.warn{background:var(--warn)}
.note a{color:var(--forest); font-weight:700}
input,select,textarea{width:100%; background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:11px 12px; outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--forest)}
textarea{min-height:150px; resize:vertical; line-height:1.55}
label{display:block; font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); margin:12px 0 6px}
.seg{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; margin:0 0 12px}
.seg button{flex:none; border:1px solid var(--line); background:var(--paper); color:var(--muted); border-radius:999px; padding:8px 12px; font-size:14px; font-weight:650; min-height:36px}
.seg button.on{background:var(--forest); color:var(--btn-ink); border-color:transparent}
.item{width:100%; text-align:left; display:flex; gap:12px; align-items:center; padding:12px 2px; border:0; border-bottom:1px solid var(--line); background:transparent; color:inherit; min-height:44px}
.item:last-child{border-bottom:0}
.mono{width:42px; height:42px; border-radius:12px; background:var(--gold-2); color:var(--forest); display:grid; place-items:center; font-family:var(--serif); font-weight:700; flex:none}
.chev{color:var(--muted); font-size:20px}
.phrase{display:flex; gap:8px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line)}
.phrase:last-of-type{border-bottom:0}
.en{font-family:var(--serif); font-weight:560; font-size:18px; letter-spacing:-.02em; line-height:1.35}
.fc{min-height:250px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; background:var(--paper); border:1px solid var(--line); border-radius:22px; padding:28px 20px; margin:12px 0; box-shadow:var(--shadow)}
.fc .t{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:12px}
.fc .f{font-family:var(--serif); font-size:30px; font-weight:560; letter-spacing:-.03em; line-height:1.2; white-space:pre-wrap}
.fc .b{font-size:18px; margin-top:14px; white-space:pre-wrap}
.prog{height:4px; background:var(--line); border-radius:99px; overflow:hidden; margin-top:8px}
.prog i{display:block; height:100%; background:var(--forest)}
.rate{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px}
.rate .btn{flex-direction:column; gap:0; min-height:64px}
.rate small{color:inherit; opacity:.8; font-size:11px; font-weight:500}
#micBtn.on{background:#c0392b;color:#fff;border-color:#c0392b;animation:micPulse 1.4s ease-in-out infinite}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,.55)}50%{box-shadow:0 0 0 7px rgba(192,57,43,0)}}
@media (prefers-reduced-motion:reduce){#micBtn.on{animation:none}}
.keys{display:none; text-align:center; margin-top:8px}
.ans{background:var(--bg); border-radius:12px; padding:12px 14px; margin:6px 0; white-space:pre-wrap; overflow-wrap:anywhere; font-family:var(--serif); font-size:18px; line-height:1.45}
.err{border:1px solid var(--line); border-radius:14px; padding:12px; margin:8px 0; background:var(--bg)}
.err .w{color:var(--bad); text-decoration:line-through}
.err .r{color:var(--ok); font-weight:700}
.q{border:1px solid var(--line); border-radius:14px; padding:14px; margin:10px 0; background:var(--bg)}
.opt{display:block; width:100%; text-align:left; background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:6px 0; color:inherit; min-height:44px}
.opt.good{border-color:var(--ok); background:color-mix(in srgb, var(--ok) 14%, var(--paper))}
.opt.bad{border-color:var(--bad); background:color-mix(in srgb, var(--bad) 12%, var(--paper))}
.why{font-size:14px; color:var(--muted); margin-top:6px}
.w-ok{color:var(--ok); font-weight:700}
.w-bad{color:var(--bad); font-weight:700; text-decoration:underline}
.plan{list-style:none; margin:0; padding:0; display:grid; gap:8px}
.plan button{width:100%; text-align:left; display:flex; gap:12px; align-items:center; background:var(--bg); border:1px solid var(--line); border-radius:14px; padding:12px; min-height:52px}
.plan button.done{background:color-mix(in srgb, var(--ok) 10%, var(--paper)); border-color:transparent}
.tick{width:22px; height:22px; border-radius:99px; border:1.5px solid var(--line); display:grid; place-items:center; flex:none; color:transparent}
.plan button.done .tick{background:var(--ok); border-color:var(--ok); color:#fff}
.wbars{display:flex; align-items:flex-end; gap:8px; height:108px}
.wcol{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:6px; height:100%; min-width:0}
.wcol i{display:block; width:100%; max-width:26px; border-radius:8px 8px 3px 3px; background:var(--forest); min-height:4px}
.wcol span{font-size:11px; color:var(--muted)}
.wcol.today span{color:var(--ink); font-weight:700}
.wcol.today i{background:var(--gold)}
.bars{display:flex; gap:6px; align-items:flex-end; height:64px; margin-top:10px}
.bars i{flex:1; background:var(--forest); border-radius:5px 5px 2px 2px; min-height:3px; opacity:.9}
.bars span{flex:1; text-align:center; font-size:10px; color:var(--muted)}
.heatwrap{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; max-width:100%}
.heatdays{display:grid; grid-template-rows:repeat(7,12px); gap:3px; font-size:9px; color:var(--muted); flex:none; padding-top:0}
.heatdays span{line-height:12px}
.heat{display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,12px); gap:3px}
.heat i,.legend i{width:12px; height:12px; border-radius:3px; background:var(--h0); display:block}
.heat i.lv1,.legend i.lv1{background:var(--h1)}
.heat i.lv2,.legend i.lv2{background:var(--h2)}
.heat i.lv3,.legend i.lv3{background:var(--h3)}
.heat i.lv4,.legend i.lv4{background:var(--h4)}
.heat i.fut{opacity:.35}
.legend{display:flex; align-items:center; gap:4px; margin-top:8px; color:var(--muted); font-size:11px}
.erow{margin:8px 0}
.erowtop{display:flex; justify-content:space-between; font-size:14px; gap:8px}
.ebar{height:6px; background:var(--bg); border-radius:99px; margin-top:4px; overflow:hidden}
.ebar i{display:block; height:100%; background:var(--forest); border-radius:99px}
.hitem{width:100%; text-align:left; display:flex; gap:10px; align-items:flex-start; padding:12px 0; border:0; border-bottom:1px solid var(--line); background:transparent; color:inherit}
.hitem:last-child{border-bottom:0}
.hico{width:34px; height:34px; border-radius:10px; background:var(--bg); display:grid; place-items:center; flex:none; color:var(--forest)}
.daylab{font-size:13px; font-weight:700; margin:14px 0 0}
.link{display:block; padding:12px 0; border-bottom:1px solid var(--line); text-decoration:none; color:inherit}
.link:last-child{border-bottom:0}
.src b{display:block}
.cmp{display:grid; gap:10px}
.navb,.tabb{color:inherit}
.tabbar{position:fixed; left:0; right:0; bottom:0; background:var(--paper); border-top:1px solid var(--line); z-index:12; padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar #tabNav{display:grid; grid-template-columns:repeat(5,1fr); max-width:640px; margin:0 auto}
.tabb{border:0; background:transparent; color:var(--muted); padding:8px 2px 10px; font-size:11px; font-weight:650; display:grid; gap:2px; justify-items:center; min-height:58px}
.tabb.on{color:var(--forest)}
.tabb svg,.navb svg,.iconbtn svg,.hico svg{display:block}
#dlg{position:fixed; inset:0; background:rgba(20,16,10,.48); z-index:40; display:grid; place-items:center; padding:16px}
#dlg[hidden]{display:none}
.dbox{background:var(--paper); border:1px solid var(--line); border-radius:18px; padding:18px; max-width:400px; width:100%; box-shadow:var(--shadow)}
#toast{position:fixed; left:50%; bottom:96px; transform:translateX(-50%) translateY(8px); background:#1c1915; color:#f6f1e7; padding:10px 14px; border-radius:999px; font-size:14px; opacity:0; pointer-events:none; transition:.2s; z-index:30; max-width:min(92vw,440px); text-align:center}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
a{color:var(--forest)}
.only-desktop{display:none}
svg{width:20px; height:20px}
@media (min-width:800px){
  .stats.cols3{grid-template-columns:repeat(3,1fr)}
  .split{grid-template-columns:1.15fr .85fr; align-items:start}
  .cmp{grid-template-columns:1fr 1fr}
  h1{font-size:52px}
}
@media (min-width:980px){
  body{padding:22px 18px; background:#e4d8c4; background-image:radial-gradient(rgba(28,25,21,.045) 0.7px, transparent 0.7px); background-size:5px 5px}
  .shell{display:grid; grid-template-columns:248px minmax(0,1fr); max-width:1120px; margin:0 auto; min-height:calc(100dvh - 44px); border-radius:28px; overflow:hidden; border:1px solid rgba(28,25,21,.08); box-shadow:0 30px 70px rgba(60,40,10,.14)}
  .side{display:flex; flex-direction:column; gap:8px; background:var(--sidebar); color:var(--side-fg); padding:22px 14px 16px; position:sticky; top:0; height:calc(100dvh - 44px)}
  .brand{display:flex; gap:10px; align-items:center; padding:0 8px 12px}
  .brand small{color:var(--side-muted); font-size:12px}
  .brand .brandmark{font-size:20px; color:var(--side-fg)}
  .brand .brandmark i{color:#e4c07a}
  .mark{width:40px; height:40px; border-radius:12px; background:#143528; color:#f3e6cf; display:grid; place-items:center; font-family:var(--serif); font-weight:700; border:1px solid rgba(243,230,207,.2)}
  .sidenav{display:flex; flex-direction:column; gap:4px}
  .navb{display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:transparent; color:var(--side-muted); border:0; border-radius:12px; padding:10px 12px; font-weight:600; min-height:44px}
  .navb.on{background:rgba(255,255,255,.1); color:#fff}
  .navgap{height:8px}
  .sidefoot{margin-top:auto; padding:12px; border-top:1px solid rgba(255,255,255,.1)}
  .side-streak{display:flex; align-items:baseline; gap:8px}
  .side-streak b{font-family:var(--serif); font-size:36px; font-weight:560; letter-spacing:-.03em; line-height:1}
  .side-streak span,.side-ai{color:var(--side-muted); font-size:12px}
  .side-ai{margin-top:4px}
  .tabbar{display:none}
  .only-mobile{display:none}
  .only-desktop{display:initial}
  .top{padding:22px 28px 0; background:transparent; backdrop-filter:none; position:static}
  main{padding:6px 28px 36px}
  .keys{display:block}
  #toast{bottom:28px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important}
  .btn:active{transform:none}
}

/* ---- sampul ---- */
:root{--cv-bg:#14352a;--cv-ink:#f6f1e7;--cv-mute:#bcd2c1;--cv-gold:#e8c98b;--cv-btn:#f3e6cf;--cv-btn-ink:#14352a}
html.cv-on,html.cv-on body{overflow:hidden}
#cover{position:fixed;inset:0;z-index:60;background:var(--cv-bg);color:var(--cv-ink);overflow:hidden;opacity:1;visibility:visible;transition:opacity .35s ease,visibility 0s}
#cover[hidden]{display:none}
#cover.out{opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s .35s}
#cover .cv-in{position:relative;z-index:1;width:min(100%,760px);height:100%;margin:0 auto;display:flex;flex-direction:column;justify-content:space-between;gap:24px;
  padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
#cover .cv-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--cv-mute)}
#cover .cv-mid{min-width:0}
#cover .cv-kick{margin:0 0 14px;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--cv-gold)}
#cover .cv-title{font-family:var(--serif);font-weight:560;font-size:clamp(64px,19vw,140px);line-height:.92;letter-spacing:-.04em;margin:0 0 18px;color:var(--cv-ink);text-wrap:balance}
#cover .cv-title em{font-style:italic;color:var(--cv-gold);font-weight:560}
#cover .cv-sub{margin:0;max-width:34ch;font-size:18px;line-height:1.45;color:var(--cv-mute)}
#cover .cv-bot{display:grid;gap:18px}
#cover .cv-phrase{border-top:1px solid rgba(232,201,139,.35);padding-top:16px;display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center}
#cover .cv-label{grid-column:1/-1;margin:0 0 4px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--cv-gold)}
#cover .cv-en{margin:0;font-family:var(--serif);font-style:italic;font-weight:560;font-size:clamp(22px,5.4vw,30px);line-height:1.2;color:var(--cv-ink);min-width:0}
#cover .cv-id{grid-column:1;margin:0;font-size:14px;color:var(--cv-mute)}
#cover .cv-say{grid-row:2/4;grid-column:2;width:44px;height:44px;border-radius:50%;border:1px solid rgba(232,201,139,.55);background:transparent;color:var(--cv-gold);display:grid;place-items:center}
#cover .cv-say svg{width:20px;height:20px;display:block}
#cover .cv-go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border:0;border-radius:16px;background:var(--cv-btn);color:var(--cv-btn-ink);font-weight:700;font-size:18px;letter-spacing:.01em}
#cover .cv-go svg{width:22px;height:22px;display:block}
#cover .cv-go:active{transform:translateY(1px)}
#cover button:focus-visible{outline:2px solid var(--cv-gold);outline-offset:3px}
#cover .cv-mono{position:absolute;right:-4vw;bottom:-9vw;font-family:var(--serif);font-weight:700;font-size:clamp(260px,64vw,560px);line-height:1;letter-spacing:-.06em;color:var(--cv-gold);opacity:.07;pointer-events:none;user-select:none}
@media (min-width:720px){#cover .cv-go{width:auto;min-width:220px;justify-self:start;padding:0 28px}}
@keyframes cvUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#cover .cv-in>*{animation:cvUp .6s cubic-bezier(.2,.7,.2,1) both}
#cover .cv-in>.cv-mid{animation-delay:.08s}
#cover .cv-in>.cv-bot{animation-delay:.2s}
@media (prefers-reduced-motion:reduce){#cover,#cover.out{transition:none}#cover .cv-in>*{animation:none}}
/* ---- buku kesalahan ---- */
.nrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line)}
.nrow:last-child{border-bottom:0}
.nline{font-size:17px;line-height:1.4;overflow-wrap:anywhere}
.nw{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1.5px}
.nr{color:var(--ok);font-weight:650}
.narrow{color:var(--muted);margin:0 6px}
.nrow small{margin-top:2px}
.nmeta{font-size:12px;letter-spacing:.02em}
.nact{display:flex;gap:6px}
.nfoot{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.iconbtn.sm{width:38px;height:38px}
.iconbtn.sm svg{width:18px;height:18px}
.nx:hover{color:var(--bad);border-color:var(--bad)}

/* ---- v2 ---- */
.tabbar #tabNav{grid-template-columns:repeat(6,1fr)}
.tabb{font-size:10.5px}
.expl{line-height:1.7;font-size:15.5px}
.bigscore{font-family:var(--serif);font-size:56px;font-weight:560;letter-spacing:-.04em;line-height:1}
.chat{display:flex;flex-direction:column;gap:10px;max-height:56vh;overflow-y:auto;padding:4px 2px 10px;margin:10px 0}
.msg{max-width:92%;padding:10px 13px;border-radius:16px;line-height:1.5;overflow-wrap:anywhere}
.msg.ai{background:var(--paper);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:5px}
.msg.me{background:var(--forest);color:var(--btn-ink);align-self:flex-end;border-bottom-right-radius:5px}
.msg .fixes{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;font-size:14px}
.typing{color:var(--muted);font-size:14px;align-self:flex-start;padding:4px 8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 8px}
.chip2{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;min-height:36px}
.chip2[disabled]{opacity:.45}
.tokarea{min-height:56px;border:1px dashed var(--line);border-radius:12px;padding:8px;display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tokbtn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;font-size:16px;min-height:40px}

ex:"Permintaan sopan: **Could I ...?** / **Could you ...?** / **Would you mind + -ing?**\nBandara dan hotel: boarding pass, gate, check in / check out, reservation, luggage.\n• Could I have a window seat, please?\n• Would you mind **opening** the window? (mind + -ing)\nJawaban: Sure. / Of course. / Sorry, I can't.",
ph:[["I have a reservation under the name Dewi.","Saya punya reservasi atas nama Dewi."],["Could I have a window seat, please?","Boleh saya dapat kursi dekat jendela?"],["What time is check-out?","Check-out jam berapa?"],["Would you mind taking a photo of us?","Maukah Anda memotret kami?"]],
q:[mq("____ I have a receipt, please?",["Could","Do","Are"],0,"Could I ...? = permintaan sopan."),
mq("Would you mind ____ the door?",["close","closing","to close"],1,"mind + -ing."),
fq("We arrived early, so we couldn't check ____ until 2 p.m.","in","check in = lapor masuk hotel."),
oq("Could you tell me where gate five is?"),
xq("Can you to help me with my luggage?","Can you help me with my luggage?","can + verb dasar."),
mq("At the airport you show your ____ to get on the plane.",["boarding pass","receipt","menu"],0,"boarding pass = kartu naik pesawat.")],
task:"You arrive at a hotel. Write a short conversation with the receptionist (4 lines).",ttype:"bebas"},

{id:"u8",lv:"A2",tag:"work",et:"word_choice",t:"Work Messages & Clarifying",g:"Write clear messages and ask for clarification.",
ex:"Pesan kerja yang jelas: salam, tujuan, permintaan, penutup.\n• **confirm** langsung diikuti objek (tanpa about): Please **confirm the date**.\n• **attach**: I've **attached the file**. (the + file tertentu)\n• **feedback** tidak terhitung: Thanks for **your feedback**. (bukan a feedback / feedbacks)\n• Klarifikasi: Could you clarify ...? / Just to confirm, ..., right?",
ph:[["Just to confirm, the deadline is Friday, right?","Sekadar konfirmasi, tenggatnya hari Jumat, kan?"],["Could you please clarify what you mean by 'revision'?","Bisa tolong jelaskan maksud 'revisi'?"],["I've attached the file for your review.","Saya lampirkan file untuk Anda periksa."],["Thank you for your feedback.","Terima kasih atas masukannya."]],
q:[mq("Which is correct?",["Please confirm about the date.","Please confirm the date.","Please confirm of the date."],1,"confirm + objek langsung."),
mq("Thank you for your ____.",["feedbacks","a feedback","feedback"],2,"feedback tidak terhitung."),
fq("I've ____ the file to this email. (attach)","attached","have + past participle."),
oq("Could you please clarify the deadline?"),
xq("I attached file to this email.","I attached the file to this email.|I've attached the file to this email.","Pakai the untuk file tertentu yang dimaksud."),
mq("Which sentence asks for clarification?",["Just to confirm, the report is due Monday, right?","I will send it tomorrow.","Thanks for joining."],0,"Just to confirm ... right? = memastikan.")],
task:"A client sent an unclear task. Write a short message with 2 clarifying questions.",ttype:"pesan klien"},

{id:"u9",lv:"A2",tag:"work",et:"word_choice",t:"Meeting Starters",g:"Use ready-made phrases to run and join a meeting.",
ex:"Hafalkan frasa meeting sebagai satu blok:\n• Membuka: Thanks for joining. Let's get started.\n• Tidak dengar: Could you say that again, please? / Could you speak a little slower, please?\n• Konfirmasi: Just to confirm, ..., right?\n• Menunda jawaban: Let me check and get back to you.\n• Menutup: I'll send you the summary by email. / Thank you for your time.",
ph:[["Thanks for joining. Let's get started.","Terima kasih sudah bergabung. Ayo mulai."],["Could you speak a little slower, please?","Bisa bicara sedikit lebih pelan?"],["Let me check and get back to you.","Biar saya cek dan kabari Anda."],["I'll send you the summary by email.","Saya kirim ringkasannya lewat email."]],
q:[mq("You didn't hear clearly. You say:",["Could you say that again, please?","Please explain me again now.","Say again."],0,"Sopan dan jelas."),
mq("At the start of a meeting you say:",["Thanks for joining. Let's get started.","See you later.","Nice to meet you, goodbye."],0,"Pembuka meeting."),
fq("Let me check and get ____ to you. (back)","back","get back to you = kabari balik."),
oq("I'll send you the summary by email."),
xq("Could you speak more slow, please?","Could you speak a little slower, please?|Could you speak slower, please?","slow → slower (comparative)."),
mq("You need time to find the answer. You say:",["I don't know.","Let me check and get back to you.","No problem, next."],1,"Cara profesional menunda jawaban.")],
task:"Write what you would say in the first minute of a client meeting (4 sentences).",ttype:"pesan klien"},

{id:"u10",lv:"A2",tag:"core",et:"plural",t:"Uncountable Nouns & Articles",g:"Stop mistakes with advice, information, feedback, a / the.",
ex:"**Tak terhitung** (tanpa a/an, tanpa -s): advice, information, feedback, news, furniture, work, money.\n✗ an advice, informations, feedbacks\n✓ **some advice**, a piece of advice, some information.\n**a/an** untuk benda tunggal yang pertama disebut; **the** untuk yang sudah jelas.\n• We took **a** trip. **The** trip was great.\n• I have **a** craving for sambal. (craving terhitung)\nMakanan/benda umum tanpa artikel: I love street food.",
ph:[["Could you give me some advice?","Bisa beri saya saran?"],["I need some information about the price.","Saya perlu informasi soal harga."],["I have a craving for fried rice.","Saya lagi ngidam nasi goreng."],["We took a trip to Bali. The trip was amazing.","Kami liburan ke Bali. Perjalanannya luar biasa."]],
q:[mq("Can I ask you for ____?",["an advice","some advice","advices"],1,"advice tidak terhitung."),
mq("I need more ____ about the project.",["informations","information","an information"],1,"information tidak terhitung."),
fq("She gave me a lot of ____. (feedback / feedbacks)","feedback","feedback tidak punya bentuk jamak."),
mq("We took ____ trip to Lombok. ____ trip was great.",["a / The","the / A","a / A"],0,"Pertama disebut: a. Sudah jelas: the."),
xq("She gave me a good advices.","She gave me good advice.|She gave me some good advice.|She gave me a good piece of advice.","advice tidak terhitung."),
oq("I have a craving for fried rice.")],
task:"Write 4 sentences giving advice to a friend who starts a new job. Use advice and information correctly.",ttype:"bebas"}
];

{id:"u11",lv:"B1",tag:"core",et:"tense",t:"Present Perfect with since / for",g:"Say how long something has been true.",
ex:"**Present perfect** = have / has + past participle. Dipakai untuk keadaan atau aksi yang dimulai di masa lalu dan masih berlanjut.\n• **since** + titik waktu: since Monday, since 2024.\n• **for** + lama waktu: for three days, for two years.\n• Dengan since / for pakai **have/has been**, bukan present simple:\n  ✗ The invoice is overdue since May.\n  ✓ The invoice **has been** overdue since May.\n• I **have been waiting** for your reply **since** Monday.",
ph:[["I have been waiting for your reply since Monday.","Saya menunggu balasan Anda sejak Senin."],["The invoice has been overdue since last week.","Tagihannya sudah lewat jatuh tempo sejak minggu lalu."],["I've worked here for two years.","Saya sudah bekerja di sini dua tahun."],["Have you finished the report yet?","Apakah kamu sudah menyelesaikan laporannya?"]],
q:[mq("I ____ for your reply since Monday.",["wait","am waiting","have been waiting"],2,"since + have been + -ing."),
mq("She has lived here ____ 2022.",["for","since","from"],1,"2022 = titik waktu → since."),
mq("We've known each other ____ five years.",["since","for","at"],1,"five years = lama waktu → for."),
fq("The invoice ____ overdue since May. (be)","has been","since → has been."),
xq("The client is waiting for us since two hours.","The client has been waiting for us for two hours.|The client has waited for us for two hours.","since + titik waktu, for + lama waktu; pakai present perfect."),
oq("I have been working here since 2023.")],
task:"Write an email asking a client about an unpaid invoice. Use since and have been.",ttype:"email"},

{id:"u12",lv:"B1",tag:"core",et:"word_choice",t:"-ed vs -ing Adjectives",g:"Describe feelings and what causes them.",
ex:"**-ing** = menggambarkan hal / penyebab. **-ed** = perasaan orang.\n• The movie is **boring**. I am **bored**.\n• The trip was **exhausting**. I felt **exhausted**.\n• Pasangan umum: relaxing / relaxed, exciting / excited, surprising / surprised, overwhelming / overwhelmed.\n• **tedious** = membosankan dan melelahkan, untuk hal / tugas, bukan perasaan.",
ph:[["I'm so excited about the trip!","Saya sangat antusias soal perjalanannya!"],["The meeting was really boring.","Rapatnya membosankan sekali."],["I felt exhausted after the long flight.","Saya kelelahan setelah penerbangan panjang."],["This spreadsheet is so tedious.","Spreadsheet ini membosankan sekali."]],
q:[mq("The lecture was ____.",["bored","boring","bore"],1,"Hal / penyebab → -ing."),
mq("I was really ____ after work.",["exhausting","exhausted","exhaust"],1,"Perasaan orang → -ed."),
mq("The beach was so ____. I felt very ____.",["relaxing / relaxed","relaxed / relaxing","relax / relaxed"],0,"Pantai = penyebab (-ing), saya = perasaan (-ed)."),
fq("Everyone was ____ by the good news. (surprise)","surprised","Perasaan orang → -ed."),
xq("The movie was bored, so I felt tired.","The movie was boring, so I felt tired.","Film = penyebab → boring."),
mq("Pick the word for a boring, repetitive task:",["tedious","exquisite","breathtaking"],0,"tedious = membosankan dan berulang.")],
task:"Describe a trip or a day when you felt tired or relaxed. Use at least 2 -ed and 2 -ing adjectives.",ttype:"jurnal"},

{id:"u13",lv:"B1",tag:"work",et:"word_choice",t:"Follow-ups & Deadlines",g:"Chase work politely and describe timelines.",
ex:"• **follow up on** (verb): I'm **following up on** my email.\n• **follow-up** (noun): I'll send a **follow-up** tomorrow.\n• **overdue** (adjective, butuh be): The invoice **is overdue**.\n• **turnaround time** = waktu pengerjaan: Our turnaround time is 48 hours.\n• **accommodate** + kebutuhan / jadwal orang: I'll try to accommodate your schedule.\n• **prioritize** + tasks (jamak): I'll prioritize the urgent tasks.",
ph:[["I'm following up on my previous email.","Saya menindaklanjuti email saya sebelumnya."],["Our usual turnaround time is two business days.","Waktu pengerjaan kami biasanya dua hari kerja."],["I'll do my best to accommodate your schedule.","Saya akan berusaha menyesuaikan dengan jadwal Anda."],["The invoice is overdue. Could you check the payment?","Tagihannya sudah lewat jatuh tempo. Bisa dicek pembayarannya?"]],
q:[mq("I'm writing to ____ my email from Monday.",["follow-up","follow up on","follow up"],1,"Verb = follow up on."),
mq("The payment ____ overdue.",["overdue","is overdue","has overdue"],1,"overdue adjective → butuh be."),
mq("'Turnaround time' means ...",["lama waktu dari permintaan sampai selesai","waktu putar balik di jalan","jam istirahat"],0,"Waktu pengerjaan."),
fq("I'll do my best to ____ your schedule. (accommodate)","accommodate","accommodate + kebutuhan / jadwal."),
xq("I need to prioritize three task today.","I need to prioritize three tasks today.","three → jamak: tasks."),
oq("I'm following up on my previous email.")],
task:"Write a polite follow-up email. The client has not replied for three days.",ttype:"email"},

{id:"u14",lv:"B1",tag:"daily",et:"word_choice",t:"Opinions & Polite Disagreement",g:"Disagree without sounding rude.",
ex:"Urutan: akui dulu, lalu sampaikan pandanganmu.\n• In my opinion, ... / I think ... / From my experience, ...\n• I see your point, **but** I have a different view.\n• That's a fair point. **However**, ...\n• Alasan: **because** + klausa, **because of** + kata benda.\n• Hindari 'No, you are wrong.' — terlalu langsung.",
ph:[["I see your point, but I have a different view.","Saya paham maksud Anda, tapi saya punya pandangan lain."],["I partly agree with you.","Saya setuju sebagian."],["In my opinion, this plan is realistic.","Menurut saya, rencana ini realistis."],["That's a fair point. However, we have limited time.","Poin yang adil. Namun, waktu kita terbatas."]],
q:[mq("Which is the most polite way to disagree?",["No, you are wrong.","I see your point, but I see it differently.","That is a stupid idea."],1,"Akui dulu, baru beda pendapat."),
mq("We stayed home ____ the rain.",["because","because of","so"],1,"because of + kata benda."),
mq("I was late ____ the traffic was terrible.",["because","because of","although"],0,"because + klausa."),
fq("That's a fair point. ____, we don't have enough budget. (However)","however","However = namun."),
xq("I am agree with you.","I agree with you.","agree adalah verb, tanpa am."),
oq("I partly agree with you, but I have another idea.")],
task:"Write your opinion about working from home. Give two reasons and one polite counterpoint.",ttype:"bebas"},

{id:"u15",lv:"B1",tag:"travel",et:"word_choice",t:"Food, Travel & Feelings",g:"Tell vivid stories with natural vocabulary.",
ex:"Kosakata hidup untuk cerita santai:\n• **craving** (n.) ngidam: I have **a** craving for sambal.\n• **savor** (v.) menikmati pelan-pelan: I savored every bite.\n• **hidden gem** = tempat bagus yang belum banyak diketahui. **tucked (away)** = terselip di tempat tersembunyi. Artinya berbeda.\n• **breathtaking** memukau, **hectic** sangat sibuk, **wander** berkeliaran santai, **rejuvenate** menyegarkan kembali.\n• Nuansa: kata tinggi tidak selalu lebih baik. Nasi goreng itu **delicious / tasty**, bukan *exquisite* (terlalu mewah).",
ph:[["I have a craving for fried rice.","Saya lagi ngidam nasi goreng."],["This cafe is a hidden gem.","Kafe ini tempat tersembunyi yang bagus."],["The view from the top was breathtaking.","Pemandangan dari atas memukau."],["I need a weekend away to rejuvenate.","Saya butuh akhir pekan di luar kota untuk menyegarkan diri."]],
q:[mq("After a ____ week at work, I just wanted to rest.",["hectic","breathtaking","irresistible"],0,"hectic = sangat sibuk."),
mq("The sunset was ____. I couldn't stop taking photos.",["hectic","breathtaking","tedious"],1,"breathtaking = memukau."),
mq("Most natural for a plate of fried rice:",["It's exquisite.","It's delicious.","It's abscond."],1,"exquisite terlalu tinggi; delicious / tasty lebih natural."),
fq("I ____ every bite of the cake. (savor)","savored","Past simple dari savor."),
mq("A 'hidden gem' is ...",["tempat bagus yang belum banyak orang tahu","permata asli","tempat berbahaya"],0,"Hidden gem = tempat bagus tersembunyi."),
xq("I have craving for pizza.","I have a craving for pizza.","craving terhitung → a craving.")],
task:"Write about a meal or a place you loved. Use at least 3 new words from this unit.",ttype:"bebas"},

{id:"u16",lv:"B1",tag:"work",et:"word_choice",t:"Scheduling & Negotiating",g:"Reschedule, decline politely, and talk about rates.",
ex:"• Menjadwal: What time works best for you? / Could we **reschedule** the call to Thursday? / Could you share your **availability** for next week?\n• Menolak sopan: Unfortunately, I won't be able to ... / I'm afraid that's outside the scope. / Could we discuss another option?\n• Tarif: My rate is $10 per hour. / I'd like to discuss the rate. / I can offer a discount for a long-term project.\n• Rumus: terima kasih + alasan + alternatif.",
ph:[["Could we reschedule the call to Thursday?","Bisakah kita jadwal ulang panggilannya ke Kamis?"],["Could you share your availability for next week?","Bisa bagikan ketersediaan waktu Anda minggu depan?"],["Unfortunately, I won't be able to take on extra tasks this week.","Sayangnya, minggu ini saya tidak bisa mengambil tugas tambahan."],["My rate is ten dollars per hour. Is that okay for you?","Tarif saya sepuluh dolar per jam. Apakah itu sesuai?"]],
q:[mq("Which sentence politely declines extra work?",["No, I won't.","Unfortunately, I won't be able to take that on this week. Could we discuss another option?","That is not my job."],1,"Sopan: alasan + alternatif."),
mq("Could we ____ the meeting to Friday?",["reschedule","rescheduling","rescheduled"],0,"Could we + verb dasar."),
fq("Could you share your ____ for next week? (availability)","availability","availability = ketersediaan waktu."),
oq("Could we move the call to Thursday morning?"),
xq("Could you share me your availability?","Could you share your availability with me?|Could you share your availability?","share + benda + with + orang."),
mq("Negotiating a rate: the best opening is ...",["I'd like to discuss the rate for this project.","Give me more money.","Your price is too low."],0,"Netral dan sopan.")],
task:"A client asks for an extra task and an earlier deadline. Write a polite reply.",ttype:"email"},

{id:"u17",lv:"B1",tag:"core",et:"preposition",t:"Prepositions & Word Forms",g:"Use the right word after verbs and prepositions.",
ex:"• **wait for** + kata benda: I'm waiting **for your reply**. (✗ waiting your reply)\n• **look forward to** + -ing / noun: I look forward to **hearing** from you.\n• **depend on**, **interested in**, **good at**, **responsible for**.\n• Setelah preposisi, verb jadi **-ing**: Thank you for **waiting**.\n• **confirm** dan **discuss** + objek langsung (tanpa about): Let's discuss the plan.",
ph:[["I'm waiting for your reply.","Saya menunggu balasan Anda."],["I look forward to hearing from you.","Saya menantikan kabar dari Anda."],["Thank you for waiting.","Terima kasih sudah menunggu."],["Let's discuss the plan tomorrow.","Mari bahas rencananya besok."]],
q:[mq("I'm waiting ____ your reply.",["for","to","at"],0,"wait for."),
mq("I look forward to ____ from you.",["hear","hearing","heard"],1,"look forward to + -ing."),
mq("Thank you for ____ me.",["help","to help","helping"],2,"Setelah preposisi → -ing."),
fq("It depends ____ the budget. (on)","on","depend on."),
xq("Let's discuss about the schedule.","Let's discuss the schedule.","discuss + objek langsung."),
oq("Thank you for your patience and support.")],
task:"Write 4 sentences ending a client email. Use waiting for, look forward to, and thank you for.",ttype:"email"},

{id:"u18",lv:"B1",tag:"core",et:"subject_verb",t:"Subject–Verb Agreement",g:"Make the verb match the real subject.",
ex:"Verb mengikuti **subjek utama**, bukan kata terdekat.\n• Singular: The **chart** is missing. / **Which chart** is missing? (which + noun tunggal)\n• Jamak: The **charts** are missing.\n• **Everyone, each, every + noun** = singular: Everyone **is** ready. Each task **has** a deadline.\n• He / she / it + verb-s: She **wants** (bukan want).\n• Dua subjek dengan and = jamak: Sam and I **are** ready.",
ph:[["Which chart is missing?","Grafik yang mana yang hilang?"],["Everyone is ready.","Semua orang sudah siap."],["She wants to join the meeting.","Dia ingin ikut rapat."],["The list of tasks is on the shared drive.","Daftar tugasnya ada di drive bersama."]],
q:[mq("Which chart ____ missing?",["is","are","be"],0,"Which chart → tunggal → is."),
mq("Everyone ____ ready for the call.",["are","is","were"],1,"Everyone → singular."),
mq("The list of tasks ____ long.",["is","are","have"],0,"Subjek utama = list."),
fq("She ____ to join the meeting. (want)","wants","she → wants."),
xq("Sam and I is ready.","Sam and I are ready.","Dua subjek dengan and = jamak."),
xq("Each task have a deadline.","Each task has a deadline.","each + singular → has.")],
task:"Write 5 sentences about your team or family. Check that every verb matches its subject.",ttype:"bebas"},

{id:"va1",lv:"A2",tag:"va",et:"word_choice",t:"VA: Introducing Your Services",g:"Present yourself and your skills to a client.",
ex:"Perkenalan profesional: nama, pengalaman, layanan, tools.\n• I'm a virtual assistant with two years of experience.\n• I help clients **manage** their inbox and calendar. (help + orang + verb dasar)\n• I have experience **with** Trello. (jangan am + have)\n• I pay attention to detail.",
ph:[["I'm a virtual assistant with two years of experience.","Saya virtual assistant dengan pengalaman dua tahun."],["I help clients manage their inbox and calendar.","Saya membantu klien mengelola email dan kalender."],["I'm a fast learner and I pay attention to detail.","Saya cepat belajar dan teliti."],["I'm available from nine to five your time.","Saya tersedia pukul sembilan sampai lima waktu Anda."]],
q:[mq("I help clients ____ their calendar.",["manage","managing","to managing"],0,"help + verb dasar."),
mq("I have two years of experience ____ customer support.",["in","at","of"],0,"experience in ..."),
fq("I pay ____ to detail. (attention)","attention","pay attention to."),
oq("I'm a fast learner and I pay attention to detail."),

{id:"va2",lv:"B1",tag:"va",et:"tense",t:"VA: Client Updates & Scope",g:"Report progress and protect your scope.",
ex:"Update klien: apa yang selesai → sedang dikerjakan → perkiraan selesai → lampiran.\n• I've finished the first part. • I'm currently working on the second part. • I expect to finish by tomorrow afternoon. • Please find the report attached.\nLingkup: **That's outside the scope of this task.** Lalu tawarkan opsi.",
ph:[["I've finished the first part of the task.","Bagian pertama tugas sudah selesai."],["I expect to finish it by tomorrow afternoon.","Saya perkirakan selesai besok siang."],["Please find the report attached.","Laporan terlampir."],["That's outside the scope of this task. Could we discuss it?","Itu di luar lingkup tugas ini. Bisa kita bahas?"]],
q:[mq("Please ____ the report attached.",["find","found","finding"],0,"Please + verb dasar."),
mq("I'm currently ____ on the second part.",["work","working","worked"],1,"am + -ing."),
fq("I ____ to finish it by tomorrow afternoon. (expect)","expect","expect + to verb."),
mq("A client asks for extra work. A good reply:",["That's outside the scope, but I can quote it separately.","No.","Do it yourself."],0,"Tegas tapi memberi opsi."),
xq("I have finish the first part.","I have finished the first part.","have + past participle."),
oq("I'll send you a weekly progress report every Monday.")],

);

UNITS.push(
/* ================= B2 (explanations in English) ================= */
{id:"u19",lv:"B2",tag:"core",et:"tense",t:"Conditionals: Unreal Situations",g:"Talk about imaginary present and past situations.",
ex:"**Second conditional** (unreal present / future): If + past simple, would + verb.\n*If I had more time, I would learn Spanish.*\n**Third conditional** (unreal past): If + past perfect, would have + past participle.\n*If I had left earlier, I would have caught the train.*\n**Mixed**: *If I had taken that job, I would be richer now.*\nTip: do not use *would* in the if-clause.",
ph:[["If I had more time, I would study every day.","Kalau saya punya lebih banyak waktu, saya akan belajar tiap hari."],["If I had known, I would have called you.","Kalau saya tahu, saya pasti sudah menelepon."],["Had I left earlier, I wouldn't have missed the flight.","Seandainya saya berangkat lebih awal, saya tidak akan ketinggalan pesawat."],["If we had confirmed the deadline, we wouldn't be rushing now.","Kalau kita sudah mengonfirmasi tenggatnya, kita tidak akan terburu-buru sekarang."]],
q:[mq("If I ____ more free time, I would travel more.",["have","had","would have"],1,"Second conditional: if + past simple."),
mq("If she had checked the email, she ____ the mistake.",["would notice","would have noticed","noticed"],1,"Third conditional: would have + past participle."),
fq("If they ____ earlier, they would have caught the train. (leave)","had left","Third conditional: if + past perfect."),
mq("Which sentence is a mixed conditional?",["If I had taken the job, I would be richer now.","If I take the job, I will be richer.","If I took the job, I would be rich."],0,"Past condition, present result."),
xq("If I would have more time, I would learn Spanish.","If I had more time, I would learn Spanish.","No 'would' in the if-clause."),
oq("If we had confirmed the deadline, we would not be rushing now.")],
task:"Write 5 sentences about things you would do differently in your work or study. Use second and third conditionals.",ttype:"bebas"},

{id:"u20",lv:"B2",tag:"core",et:"tense",t:"Passive Voice & Reported Speech",g:"Focus on the action and report what others said.",
ex:"**Passive**: be + past participle. Use it when the action matters more than who did it. *The invoice was sent yesterday. The files have been updated.*\n**Reported speech**: shift the tense back. *'I'm busy,' she said.* → *She said she was busy.* 'I will call' → she would call. 'I have finished' → she had finished.\n**Reported questions** keep statement order: *She asked if I was free.*",
ph:[["The invoice was sent yesterday.","Tagihannya dikirim kemarin."],["The files have been updated.","File-filenya sudah diperbarui."],["She said she would call me back.","Dia bilang akan menelepon balik."],["He asked whether the report was ready.","Dia bertanya apakah laporannya sudah siap."]],

{id:"u21",lv:"B2",tag:"daily",et:"word_choice",t:"Nuance: Choosing the Right Word",g:"Pick words by register, connotation, and collocation.",
ex:"Higher-level words are not always better. Choose by **register** (formal / neutral / casual), **connotation** (positive / negative) and **collocation** (words that go together).\n• *abscond* = run away secretly to avoid arrest. Negative. For a holiday use *escape* or *get away*.\n• *exquisite* = extremely beautiful or refined. Too strong for everyday food: *delicious*, *tasty*.\n• *tedious* describes a task; *bored* describes a person.\n• Collocations: make a decision, do research, take a break, raise a concern, meet a deadline.",
ph:[["I need a short getaway after this hectic month.","Saya butuh liburan singkat setelah bulan yang sibuk ini."],["We need to meet the deadline.","Kita harus memenuhi tenggat."],["She raised a valid concern about the budget.","Dia menyampaikan kekhawatiran yang valid soal anggaran."],["The soup was tasty, but nothing special.","Supnya enak, tapi biasa saja."]],
q:[mq("Which fits a holiday?",["I absconded to Bali for the weekend.","I escaped to Bali for the weekend.","I fled Bali for the weekend."],1,"Abscond is negative; escape fits a getaway."),
mq("Most natural: 'The street food was ____.'",["exquisite","delicious","resplendent"],1,"Everyday food: delicious / tasty."),
mq("We must ____ the deadline.",["reach","meet","catch"],1,"Collocation: meet a deadline."),
fq("Please ____ a decision by Friday. (make)","make|take","Collocation: make a decision."),
mq("Which word describes a task, not a feeling?",["bored","tedious","exhausted"],1,"Tedious describes the task."),
xq("I took a research about this market.","I did some research on this market.|I did research on this market.|I did some research about this market.","Research is uncountable and collocates with 'do'.")],
task:"Write a short paragraph about a trip or a work week. Choose precise but natural words. Avoid words that sound too fancy.",ttype:"bebas"},

{id:"u22",lv:"B2",tag:"work",et:"word_choice",t:"Proposals & Negotiation",g:"Propose, counter, and close with diplomacy.",

{id:"u23",lv:"B2",tag:"daily",et:"word_order",t:"Opinions, Debate & Hedging",g:"Argue a point with nuance and linking words.",
ex:"**Hedging** softens claims: *it seems that, tends to, may, arguably, to some extent*.\n**Linking ideas**: *although, whereas, on the other hand, as a result, in addition*.\n• *Remote work arguably improves focus, although it can feel isolating.*\n• Avoid absolute words (always, never, everyone) unless you can prove them.\n• Pattern: acknowledge → qualify → state your view.",
ph:[["Remote work arguably improves focus.","Kerja jarak jauh bisa dibilang meningkatkan fokus."],["On the other hand, it can feel isolating.","Di sisi lain, bisa terasa mengisolasi."],["To some extent, I agree with you.","Sampai taraf tertentu, saya setuju."],["That may be true; however, the data suggests otherwise.","Itu mungkin benar; namun, data menunjukkan sebaliknya."]],
q:[mq("Which sentence is hedged?",["Everyone hates meetings.","Meetings tend to waste time when there is no agenda.","Meetings are always useless."],1,"'Tend to' softens the claim."),
mq("Remote work improves focus, ____ it can feel isolating.",["although","because","so"],0,"Although introduces a contrast."),
mq("Choose the best link: 'Sales rose. ____, costs fell.'",["In addition","However","Despite"],0,"Adds a second positive point."),
fq("To some ____, I agree with you. (extent)","extent","to some extent = sampai taraf tertentu."),
xq("Everybody always prefers working from home.","Many people tend to prefer working from home.|Many people prefer working from home.|Most people tend to prefer working from home.","Avoid absolute claims."),
oq("On the other hand, it can feel isolating.")],
task:"Write a balanced paragraph (6 sentences) on: Is remote work better than office work? Use hedging and linking words.",ttype:"bebas"},

function clone(o){return JSON.parse(JSON.stringify(o))}
function load(){
  try{
    const o=JSON.parse(localStorage.getItem(LS)||"{}");
    const s=Object.assign(clone(DEF),o);
    ["cards","providers","history","writings","quizzes","activity","lessonsDone","notebook"].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[]});
    if(!s.reviews||typeof s.reviews!=="object"||Array.isArray(s.reviews))s.reviews={};
    if(!s.errorStats||typeof s.errorStats!=="object")s.errorStats={};
    if(!s.usage||typeof s.usage!=="object")s.usage={};
    return normalizeState(s);
  }catch(e){return clone(DEF)}
}

function seedIfNeeded(){if(S.seeded)return;S.cards=SEED.map(s=>({id:uid(),front:s[0],back:s[1],example:s[2],tag:s[3],kind:"phrase",say:s[0],box:0,due:today(),created:today(),lapses:0}));S.seeded=true;save()}
function migrate(){
  if(!Array.isArray(S.history))S.history=[];
  if(S.historyMigrated)return;
  const seen=new Set(S.history.map(h=>h.kind+":"+(h.ref||"")));
  (S.writings||[]).forEach(w=>{
    if(!w.id||seen.has("write:"+w.id))return;
    S.history.push({id:uid(),ts:(w.date||today())+"T12:00:00.000Z",date:w.date||today(),kind:"write",title:String(w.text||"").slice(0,90),detail:w.type||"",ref:w.id});
  });
  (S.quizzes||[]).forEach(q=>{
    if(!q.id||seen.has("quiz:"+q.id))return;
    const n=(q.data&&q.data.questions&&q.data.questions.length)||0;
    S.history.push({id:uid(),ts:(q.date||today())+"T12:00:00.000Z",date:q.date||today(),kind:"quiz",title:(q.data&&q.data.title)||"Quiz",detail:n+" questions",ref:q.id});
  });
  S.history.sort((a,b)=>String(b.ts).localeCompare(String(a.ts)));
  S.historyMigrated=true;save();
}

const INT=[0,1,3,7,14,30];
function focusOk(c){return S.focus==="all"||c.tag===S.focus||c.tag==="koreksi"}
function dueCards(){return S.cards.filter(c=>c.due<=today()&&focusOk(c)).sort((a,b)=>a.box-b.box||(a.due<b.due?-1:1))}
function cardById(id){return S.cards.find(c=>c.id===id)}
function nextState(c,r){let box=c.box;if(r==="again")box=0;else if(r==="good")box=Math.min(5,box+1);else box=Math.max(1,box);const days=r==="again"?0:r==="hard"?Math.max(1,Math.ceil(INT[box]/2)):INT[box];return {box,days}}
function rateCard(c,r){const n=nextState(c,r);c.box=n.box;c.due=addDays(today(),n.days);if(r==="again")c.lapses=(c.lapses||0)+1}
function addCard(o){const f=String(o.front||"").trim(),b=String(o.back||"").trim();if(!f||!b)return false;if(S.cards.some(c=>c.kind===(o.kind||"phrase")&&c.front.toLowerCase()===f.toLowerCase()))return false;S.cards.push({id:uid(),front:f,back:b,example:String(o.example||"").trim(),tag:o.tag||"umum",kind:o.kind||"phrase",say:o.say||"",box:0,due:today(),created:today(),lapses:0});return true}
function streak(){const a=new Set(S.activity);let d=today();if(!a.has(d))d=addDays(d,-1);let n=0;while(a.has(d)){n++;d=addDays(d,-1)}return n}
function mark(){const t=today();if(!S.activity.includes(t)){S.activity.push(t);if(S.activity.length>400)S.activity.shift()}save()}
function logEvent(ev){if(!Array.isArray(S.history))S.history=[];S.history.unshift(Object.assign({id:uid(),ts:new Date().toISOString(),date:today()},ev));if(S.history.length>400)S.history.length=400;mark()}
function bumpReview(r){const t=today();S.reviews[t]=S.reviews[t]||{again:0,hard:0,good:0};S.reviews[t][r]=(S.reviews[t][r]||0)+1}
function reviewsToday(){const r=S.reviews[today()]||{again:0,hard:0,good:0};return (r.again||0)+(r.hard||0)+(r.good||0)}
function dayScore(key){let n=(S.history||[]).filter(h=>h.date===key).length;const rv=S.reviews&&S.reviews[key];if(rv)n+=(rv.again||0)+(rv.hard||0)+(rv.good||0);if(!n&&S.activity.includes(key))n=1;return n}
function heatLevel(n){if(n<=0)return 0;if(n===1)return 1;if(n<=3)return 2;if(n<=7)return 3;return 4}
function weekKeys(){const now=new Date();const dow=(now.getDay()+6)%7;const mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-dow);const keys=[];for(let i=0;i<7;i++)keys.push(dstr(new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i)));return keys}
function niceDate(s){if(s===today())return "Today";if(s===addDays(today(),-1))return "Yesterday";const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}
function greet(){const h=new Date().getHours();if(h<12)return "Good morning";if(h<18)return "Good afternoon";return "Good evening"}
function dateLong(){return new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}

function speak(t,rate){if(!("speechSynthesis" in window))return toast("Speech is not supported in this browser.");try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=S.accent;u.rate=rate||S.rate;const vs=speechSynthesis.getVoices();const v=vs.find(v=>v.lang.replace("_","-")===S.accent)||vs.find(v=>v.lang.startsWith("en"));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){toast("Could not play the audio.")}}
let rec=null, micStop=false;
function mergeSpeech(list){const out=[];list.forEach(t=>{t=String(t||"").trim();if(!t)return;const last=out[out.length-1];if(last&&t.toLowerCase().startsWith(last.toLowerCase()))out[out.length-1]=t;else if(!(last&&last.toLowerCase().startsWith(t.toLowerCase())))out.push(t)});return out.join(" ")}

function toggleMic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast("Speech recognition is not supported here. Try Chrome.");if(rec){stopMic();return}const ta=$("#draft");if(!ta)return;micStop=false;rec=new SR();rec.lang=S.accent;rec.interimResults=true;rec.continuous=false;const base=ta.value.trim()?ta.value.trim()+" ":"";rec.onresult=e=>{const parts=[];for(let i=0;i<e.results.length;i++)parts.push(e.results[i][0].transcript);ta.value=(base+mergeSpeech(parts)).trim();ui.draft=ta.value;updateWc()};rec.onerror=e=>{if(e.error!=="no-speech"&&e.error!=="aborted")toast(e.error==="not-allowed"||e.error==="service-not-allowed"?(location.protocol==="file:"?"Chrome blocks the microphone for files opened from your computer. Open the app from https or localhost. Brave does not support speech recognition.":"Microphone is blocked. Allow it in the site settings and your system privacy settings."):e.error==="network"?"Speech service unreachable. Brave blocks it, so use Chrome or Edge.":"Microphone: "+e.error)};rec.onend=()=>{rec=null;micUI(false);if(!micStop){mark();toast("Press Speak again to continue.")}};try{rec.start();micUI(true)}catch(e){rec=null;micUI(false)}}

function provById(id){return S.providers.find(p=>p.id===id)}
function defProv(){return provById(S.defaultProvider)||S.providers[0]||null}
function usedToday(p){return ((S.usage[today()]||{})[p.id])||0}
function bump(p){const t=today();S.usage[t]=S.usage[t]||{};S.usage[t][p.id]=(S.usage[t][p.id]||0)+1;const old=addDays(t,-30);Object.keys(S.usage).forEach(k=>{if(k<old)delete S.usage[k]})}
function parseJSON(t){t=String(t||"").replace(/^\s*```(?:json)?\s*/i,"").replace(/```\s*$/,"").trim();const a=t.indexOf("{"),b=t.lastIndexOf("}");if(a<0||b<=a)return null;try{return JSON.parse(t.slice(a,b+1))}catch(e){return null}}
const NETERR="Cannot connect. Check your internet and the provider URL. If you opened this in a preview, outgoing requests may be blocked: download the HTML file and open it in Chrome or Edge.\nTidak bisa terhubung. Periksa internet dan URL provider. Di pratinjau koneksi keluar sering diblokir, jadi buka file HTML di Chrome atau Edge.";
async function callAI(p,system,user,opt){opt=opt||{};
  if(!p||!p.key||!p.model||!p.url)throw new Error("Finish setting up a provider in Settings: URL, key, and model ID.\nLengkapi provider di Pengaturan.");
  const ck=hash(p.model+"|"+system+"|"+user);const cache=loadCache();
  if(!opt.noTrack&&cache[ck])return {text:cache[ck].v,cached:true};
  if(!opt.noTrack&&p.limit&&usedToday(p)>=p.limit)throw new Error('Daily limit reached for "'+p.name+'" ('+p.limit+"). Pick another model or change the limit in Settings.\nBatas harian tercapai. Pilih model lain atau ubah batas di Pengaturan.");
  let text="";
  if(p.format==="gemini"){
    const url=p.url.replace(/\/$/,"")+"/models/"+encodeURIComponent(p.model)+":generateContent?key="+encodeURIComponent(p.key);
    const body={systemInstruction:{parts:[{text:system}]},contents:[{role:"user",parts:[{text:user}]}],generationConfig:{temperature:0.3,maxOutputTokens:opt.max||4096,responseMimeType:opt.json?"application/json":undefined}};
    let res;try{res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})}catch(e){throw new Error(NETERR)}
    let data={};try{data=await res.json()}catch(e){}
    if(!res.ok)throw new Error(errMsg(res.status,data));
    text=((data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts)||[]).map(x=>x.text||"").join("");
    if(!text)throw new Error("The AI returned no text"+(data.candidates&&data.candidates[0]&&data.candidates[0].finishReason?" ("+data.candidates[0].finishReason+")":"")+". Try again.");
  }else{
    const url=p.url.replace(/\/$/,"")+"/chat/completions";
    const body={model:p.model,messages:[{role:"system",content:system},{role:"user",content:user}],temperature:0.3,max_tokens:opt.max||4096};
    let res;try{res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+p.key},body:JSON.stringify(body)})}catch(e){throw new Error(NETERR)}
    let data={};try{data=await res.json()}catch(e){}
    if(!res.ok)throw new Error(errMsg(res.status,data));
    text=(data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content)||"";
    if(!text)throw new Error("The AI returned no text. Try again.");
  }
  if(!opt.noTrack){bump(p);save();let ok=true;if(opt.validate){try{opt.validate(text)}catch(e){ok=false}}if(ok){cache[ck]={t:Date.now(),v:text};saveCache(cache)}}
  return {text,cached:false}}
function errMsg(status,data){const m=(data&&data.error&&(data.error.message||data.error))||"";let h="",id="";if(status===429){h=" The quota or limit for this model is used up. Pick another model or wait for the reset.";id="Kuota model ini habis. Pilih model lain atau tunggu reset."}else if(status===400&&/api key/i.test(m)){h=" Check your API key.";id="Periksa API key."}else if(status===401||status===403){h=" Check your API key and model access.";id="Periksa API key dan izin model."}else if(status===404){h=" Check the model ID and base URL.";id="Periksa Model ID dan Base URL."}return "Request failed ("+status+")."+h+(m?" "+String(m).slice(0,160):"")+(id?"\n"+id:"")}
async function aiJSON(p,sys,user,max){
  const v=t=>{const o=parseJSON(t);if(!o||typeof o!=="object")throw new Error("bad");return o};
  let r=await callAI(p,sys,user,{json:true,max:max,validate:v});
  try{return {data:v(r.text),cached:r.cached}}catch(e){}
  r=await callAI(p,sys,user+"\n\nIMPORTANT: Return ONLY one valid JSON object. No markdown, no extra text.",{json:true,max:max,validate:v});
  try{return {data:v(r.text),cached:r.cached}}catch(e){throw new Error("Could not read the AI answer. Try again or pick another model.")}}

function modelSelect(){if(!S.providers.length)return "";const cur=(ui.model&&provById(ui.model))?ui.model:(defProv()||{}).id;return `<label>AI model</label><select id="modelSel">${S.providers.map(p=>`<option value="${p.id}" ${p.id===cur?"selected":""}>${esc(p.name)} · ${esc(p.model)} (${usedToday(p)}${p.limit?"/"+p.limit:""})</option>`).join("")}</select>`}

const SYS_CORRECT=`You are a patient English tutor for an Indonesian adult learner at A2-B1 level who wants to communicate well in English for daily life and work. Correct the learner's text. Keep the original meaning and the learner's simple vocabulary; do not make it fancy. Explanations must be in simple Indonesian (max 2 short sentences each). Return ONLY a JSON object with this exact shape:
{"corrected":"fully corrected text","natural":"a more natural or professional alternative, or empty string","errors":[{"wrong":"exact wrong part from the learner text","right":"corrected part","type":"tense|article|preposition|word_order|word_choice|spelling|punctuation|subject_verb|plural|other","why":"short explanation in simple Indonesian"}],"vocab":[{"front":"useful English phrase from the corrected text","back":"Indonesian meaning","example":"short example sentence"}],"suggested":"a model answer to the topic","suggested_id":"Indonesian translation of the model answer","tip":"one short encouraging tip in simple English","interview":""}
The user message may include a "Topic" line. "suggested" is a fresh model answer to that topic (or, if there is no topic, to the situation the learner's text is about), written as the learner could say it: same text type, simple B1 English, 3-5 sentences, natural and ready to study or reuse. It must not just repeat "corrected". Keep it relevant to the learner's own ideas where possible. "suggested_id" is its translation in simple Indonesian. List at most 6 of the most important errors. If there are no errors, return an empty errors array. Give at most 3 vocab items. If the text type is a job interview answer, put 2-3 sentences of feedback in simple English (B1 level) about content and structure in "interview"; otherwise "interview" is an empty string.`;

For mcq, "answer" is the index (0-3) of the correct option. Use only information from the material.`;

function qHTML(x,i,q){const a=q.ans[i];let inner="";

function diffWords(target,ans){const expand=s=>s.toLowerCase().replace(/[\u2019\u2018`]/g,"'").replace(/\bwon't\b/g,"will not").replace(/\bcan't\b/g,"can not").replace(/\blet's\b/g,"let us").replace(/n't\b/g," not").replace(/'re\b/g," are").replace(/'ve\b/g," have").replace(/'ll\b/g," will").replace(/'m\b/g," am").replace(/\b(it|that|what|there|here|he|she|who|where|how)'s\b/g,"$1 is");
  const norm=s=>expand(s).replace(/[^a-z0-9' ]/g," ").split(/\s+/).filter(Boolean);const a=norm(target),b=norm(ans);const n=a.length,m=b.length;const dp=Array.from({length:n+1},()=>Array(m+1).fill(0));for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);const ok=Array(n).fill(false);let i=0,j=0;while(i<n&&j<m){if(a[i]===b[j]){ok[i]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}return {words:a,ok,score:ok.filter(Boolean).length,total:n}}

function noteWrong(it,given,u){

const TMODES=[["guided","Guided lesson","One question at a time on a unit or your weak points"],["qa","Ask anything","You ask, the tutor explains and checks"],["roleplay","Roleplay","Real situations: meetings, shops, travel"],["game","Vocabulary game","Synonyms, antonyms, guess the word"],["free","Casual chat","Relaxed topics with gentle corrections"]];

function memoryText(){const p=S.profile,L=[];

  const weakU=UNITS.filter(u=>S.unitProg[u.id]&&!S.unitProg[u.id].done&&S.unitProg[u.id].last!=null).map(u=>u.t+" ("+S.unitProg[u.id].last+"%)");
  if(weakU.length)L.push("Units not passed yet: "+weakU.join("; "));
  const es=Object.entries(S.errorStats||{}).sort((a,b)=>b[1]-a[1]).slice(0,5).map(e=>(ERR_LABEL[e[0]]||e[0])+" x"+e[1]);
  if(es.length)L.push("Most frequent error types: "+es.join(", "));

function tutorSys(mode,unit){const p=S.profile,en=explLang()==="en";
  return `You are a patient, objective English tutor for ${p.name?p.name+", ":""}an Indonesian adult learner at CEFR level ${p.level||"A2"}.
Explanation language: ${en?"clear, simple English":"simple Indonesian (Bahasa Indonesia); keep English examples in English"}. Keep each reply under 140 words.

TEACHING RULES
- Ask ONE question or give ONE task at a time, then wait for the student's answer.

- Prioritise errors that hurt understanding or professionalism. A missing final period, a typo, or an acceptable word choice is NOT counted as an error; mention it lightly at most.
- Fix sentence structure before adding new vocabulary.
- Vary activities so the student does not get bored: short grammar questions, synonym or antonym multiple choice written inside sentences, guess-the-word games, short roleplays, and relaxed topics such as food or travel. Never run more than three grammar drills in a row.
- Gently bring back old mistakes from the student profile in new sentences.
- When the student is wrong: say what is wrong, give the corrected sentence, explain in one or two short sentences, then continue.
- After about 8 to 10 exchanges, ask "${en?"Continue or finish?":"Lanjut atau selesai?"}" and set ask_end to true.
MODE: ${MODE_TEXT[mode]||MODE_TEXT.free}
${unit?`CURRENT UNIT: ${unit.t} (${unit.lv}). Goal: ${unit.g}. Teaching points: ${unit.ex.replace(/\*/g,"")}`:""}
OUTPUT: Return ONLY one JSON object: {"reply":"your message to the student (plain text, **bold** allowed)","errors":[{"wrong":"exact wrong part of the student's last message","right":"correction","type":"tense|article|preposition|word_order|word_choice|spelling|punctuation|subject_verb|plural|other","why":"short explanation"}],"vocab":[{"front":"useful English phrase","back":"meaning in Indonesian","example":"short example"}],"ask_end":false}
"errors" lists only real errors in the student's LAST message (max 3). "vocab" has at most 2 items, only when new useful words appear. Use empty arrays otherwise.`}
function tutorUser(start){const T=S.tutor;let s="STUDENT PROFILE\n"+memoryText()+"\n\n";
  if(start){s+="SESSION START. "+(T.hw&&S.hw&&!S.hw.done?"The student has pending homework from the last session:\n"+S.hw.text+"\nFirst ask the student to send their homework answers, and correct them before anything else.":"Greet briefly, then ask the first question.");return s}
  s+="CONVERSATION SO FAR:\n"+T.msgs.slice(-16).map(m=>(m.r==="user"?"Student: ":"Tutor: ")+m.t).join("\n")+"\n\nRespond to the student's last message.";return s}
function cleanErrs(a){return (Array.isArray(a)?a:[]).filter(e=>e&&e.wrong&&e.right&&String(e.wrong).trim()!==String(e.right).trim()).slice(0,3).map(e=>({wrong:String(e.wrong),right:String(e.right),why:String(e.why||""),type:ERR_LABEL[e.type]?e.type:"other"}))}
async function tutorTurn(text){
  const T=S.tutor;if(!T||ui.tbusy)return;
  const p=provById(T.prov)||defProv();if(!p)return toast("Add an AI provider in Settings first.");
  if(p.limit&&usedToday(p)>=p.limit)return toast('Daily limit reached for "'+p.name+'". Pick another model or change the limit in Settings.');
  ui.tbusy=true;ui.terr="";if(text!=null)T.msgs.push({r:"user",t:text});render();
  try{
    const unit=T.unit?unitById(T.unit):null;
    const r=await callAI(p,tutorSys(T.mode,unit),tutorUser(text==null),{noTrack:true,json:true,max:1500});
    bump(p);
    let d=parseJSON(r.text);if(!d||typeof d.reply!=="string")d={reply:String(r.text||"").replace(/^\s*```(?:json)?/i,"").replace(/```\s*$/,"").slice(0,1500),errors:[],vocab:[],ask_end:false};
    const errs=cleanErrs(d.errors);const vocab=(Array.isArray(d.vocab)?d.vocab:[]).filter(v=>v&&v.front&&v.back).slice(0,2).map(v=>({front:String(v.front),back:String(v.back),example:String(v.example||"")}));
    T.msgs.push({r:"ai",t:String(d.reply),errs,vocab,end:!!d.ask_end});
    errs.forEach(e=>{S.errorStats[e.type]=(S.errorStats[e.type]||0)+1;T.errs.push(e)});
    if(errs.length)addNotes(errs,today());
    vocab.forEach(v=>T.vocab.push(v));
    if(text!=null&&T.hw&&S.hw&&!S.hw.done)S.hw.done=true;
    mark();save();
  }catch(e){
    ui.terr=e.message;
    if(text!=null){T.msgs.pop();ui.tdraft=text}else if(!T.msgs.length){S.tutor=null}
    save();
  }
  ui.tbusy=false;render();
}

  return `<div class="fixes">${e.map(x=>`<div><span class="nw">${esc(x.wrong)}</span> → <span class="nr">${esc(x.right)}</span>${x.why?`<small>${esc(x.why)}</small>`:""}</div>`).join("")}${e.length?'<small>Saved to your Mistake notebook.</small>':""}${v.map((x,i)=>`<div class="row" style="margin-top:6px"><div class="grow"><b>${esc(x.front)}</b><small>${esc(x.back)}</small></div><button class="btn ghost sm" data-act="tVocab" data-m="${mi}" data-i="${i}">Save</button></div>`).join("")}</div>`}
function chatHTML(){const T=S.tutor;const lastAi=T.msgs.slice().reverse().find(m=>m.r==="ai");

function localSummary(){const T=S.tutor||{errs:[],vocab:[]};const id=explLang()==="id";const p=S.profile;
  const L=["=== "+(id?"RINGKASAN BELAJAR":"LEARNING SUMMARY")+(p.name?": "+p.name.toUpperCase():"")+" ===",(id?"Tanggal: ":"Date: ")+today(),(id?"Level: ":"Level: ")+(p.level||"-"),""];
  L.push(id?"KESALAHAN SESI INI":"MISTAKES THIS SESSION");
  if(T.errs.length)T.errs.slice(0,12).forEach(e=>L.push("- "+e.wrong+" -> "+e.right+(e.why?" ("+e.why+")":"")));else L.push("- "+(id?"Tidak ada kesalahan penting.":"No major mistakes."));
  L.push("");L.push(id?"VOCAB BARU":"NEW VOCABULARY");
  if(T.vocab.length)T.vocab.forEach(v=>L.push("- "+v.front+" = "+v.back));else L.push("- -");
  L.push("");L.push(id?"PERLU DIPELAJARI SELANJUTNYA":"STUDY NEXT");L.push(id?"- Ulangi kalimat yang dikoreksi di atas.":"- Review the corrected sentences above.");
  return L.join("\n")}

async function finishSession(){
  const T=S.tutor;if(!T||ui.tbusy)return;
  const userN=T.msgs.filter(m=>m.r==="user").length;
  if(userN<1){S.tutor=null;save();render();return toast("Session discarded (no answers yet).")}
  ui.tbusy=true;ui.terr="";render();
  const p=provById(T.prov)||defProv();let out=null;
  const id=explLang()==="id";
  try{
    if(!p)throw new Error("no provider");
    const sys=`You write end-of-session summaries for an English tutor. Write in ${id?"Indonesian (section titles in Indonesian, English examples stay in English)":"English"}. Return ONLY one JSON object: {"summary":"copy-paste text","homework":"2-4 short tasks the student can do alone","notes":"compact memory of the student for the next session, max 1200 characters, merging the earlier notes with this session"}.
The summary must use plain text with these sections, each a short list: header line "=== ${id?"RINGKASAN BELAJAR":"LEARNING SUMMARY"}${S.profile.name?": "+S.profile.name.toUpperCase():""} ===", ${id?"Level saat ini; VOCAB DIKUASAI; VOCAB MASIH PERLU LATIHAN; VOCAB BARU SESI INI; ERROR YANG MASIH MUNCUL (urut prioritas); SUDAH BENAR; SKOR (only if scores exist); KEKUATAN; PERLU DIPELAJARI SELANJUTNYA":"Current level; VOCAB MASTERED; VOCAB NEEDS PRACTICE; NEW VOCAB THIS SESSION; ERRORS STILL APPEARING (priority order); ALREADY CORRECT; SCORES (only if scores exist); STRENGTHS; STUDY NEXT"}. Be objective, do not flatter, and do not count a missing final period or typos as errors. Only use facts from the transcript and profile; never invent scores.`;
    const user="STUDENT PROFILE\n"+memoryText()+"\n\nSESSION TRANSCRIPT ("+T.mode+"):\n"+T.msgs.slice(-40).map(m=>(m.r==="user"?"Student: ":"Tutor: ")+m.t).join("\n")+"\n\nERRORS LOGGED THIS SESSION:\n"+(T.errs.map(e=>e.wrong+" -> "+e.right).join("\n")||"none");
    const r=await callAI(p,sys,user,{noTrack:true,json:true,max:3000});bump(p);save();out=parseJSON(r.text);
  }catch(e){ui.terr=e.message}
  let ai=true;if(!out||!out.summary){ai=false;out={summary:localSummary(),homework:localHw(),notes:null}}
  const sess={id:uid(),date:today(),summary:String(out.summary),homework:String(out.homework||""),n:userN,mode:T.mode};
  S.sessions.unshift(sess);S.sessions=S.sessions.slice(0,30);
  if(sess.homework)S.hw={text:sess.homework,date:today(),done:false};
  if(out.notes)S.profile.notes=String(out.notes).slice(0,3000);
  logEvent({kind:"tutor",title:"Tutor session",detail:pl(userN,"answer")});
  S.tutor=null;ui.tsum=sess;ui.tbusy=false;save();render();
  if(!ai)toast("The AI summary failed, so this is a basic summary.");
}
