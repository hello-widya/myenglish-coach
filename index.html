<style>
:root{
  --bg:#f3eee4; --bg-2:#e7f0ea; --paper:#fffdf8; --ink:#1c1915; --muted:#5e574c;
  --line:#e4d9c8; --forest:#1b4332; --forest-2:#2d6a4f; --gold:#8d6430; --gold-2:#f3e6cf;
  --ok:#1a6b42; --bad:#8f2f2a; --warn:#f6e7c8; --btn:#1b4332; --btn-ink:#f7f3eb;
  --shadow:0 10px 30px rgba(60,40,10,.06); --serif:"Fraunces","Iowan Old Style",Palatino,"Liberation Serif","DejaVu Serif",Georgia,serif;
  --sans:"Outfit","Avenir Next","Segoe UI","Liberation Sans","DejaVu Sans",system-ui,sans-serif;
  --h0:#e6dece; --h1:#c5dccb; --h2:#7eae8e; --h3:#3d7a58; --h4:#1b4332;
  --sidebar:#1b4332; --side-fg:#f6f1e7; --side-muted:#d5e4d6; --radius:18px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#121512; --bg-2:#1a2420; --paper:#1c211d; --ink:#f4efe6; --muted:#b7afa2;
  --line:#31382f; --forest:#e4c07a; --forest-2:#8fbc8f; --gold:#e4c07a; --gold-2:#3a3224;
  --ok:#8dcea8; --bad:#f0a8a2; --warn:#3a3224; --btn:#e4c07a; --btn-ink:#1c160d;
  --shadow:none; --h0:#2a312c; --h1:#1e4634; --h2:#2f6b4c; --h3:#6eaa84; --h4:#e4c07a;
  --sidebar:#0e120f; --side-fg:#f4efe6; --side-muted:#b7c4b8;
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121512; --bg-2:#1a2420; --paper:#1c211d; --ink:#f4efe6; --muted:#b7afa2;
    --line:#31382f; --forest:#e4c07a; --forest-2:#8fbc8f; --gold:#e4c07a; --gold-2:#3a3224;
    --ok:#8dcea8; --bad:#f0a8a2; --warn:#3a3224; --btn:#e4c07a; --btn-ink:#1c160d;
    --shadow:none; --h0:#2a312c; --h1:#1e4634; --h2:#2f6b4c; --h3:#6eaa84; --h4:#e4c07a;
    --sidebar:#0e120f; --side-fg:#f4efe6; --side-muted:#b7c4b8;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:#e7dcc8; color:var(--ink);
  font:16px/1.5 var(--sans); padding-bottom:calc(78px + env(safe-area-inset-bottom,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:8}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
.shell{min-height:100dvh; background:var(--bg)}
.side{display:none}
.stage{min-width:0}
.top{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:14px 16px 12px; position:sticky; top:env(safe-area-inset-top,0px); z-index:6;
  background:color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter:blur(12px);
  border-bottom:1px solid transparent;
}
.brandmark{font-family:var(--serif); font-weight:560; font-size:22px; letter-spacing:-.03em; line-height:1}
.brandmark i{font-style:italic; color:var(--gold)}
.top-meta{display:flex; align-items:center; gap:8px; margin-left:auto}
.chip{font-size:12px; font-weight:600; color:var(--muted); background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:4px 10px; white-space:nowrap}
.iconbtn{width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:var(--paper); display:grid; place-items:center; color:var(--ink)}
.iconbtn.on{background:var(--forest); color:var(--btn-ink); border-color:transparent}
main{padding:8px 16px 28px}
h1{font-family:var(--serif); font-weight:560; font-size:40px; line-height:1.05; letter-spacing:-.03em; margin:0 0 8px}
h1 em{font-style:italic; font-weight:560}
h2{font-family:var(--serif); font-weight:560; font-size:34px; line-height:1.1; letter-spacing:-.03em; margin:0 0 6px}
h3{font-size:16px; margin:0 0 6px; letter-spacing:-.01em}
h4{font-size:12px; margin:16px 0 6px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; font-weight:700}
p{margin:6px 0}
.kicker{font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); margin:0 0 8px}
.lede{color:var(--muted); margin:0 0 16px; max-width:46ch}
.muted,small{color:var(--muted)}
small{display:block; font-size:13px; line-height:1.4}
.card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin:0 0 14px; box-shadow:var(--shadow)}
.card h3{font-family:var(--serif); font-size:22px; font-weight:560}
.stats{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:0 0 14px}
.stat{background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:14px 14px 12px}
.stat b{display:block; font-family:var(--serif); font-size:32px; font-weight:560; letter-spacing:-.03em; line-height:1}
.stat span{color:var(--muted); font-size:12px; font-weight:600}
.split{display:grid; gap:14px}
.btn{border:0; background:var(--btn); color:var(--btn-ink); padding:12px 16px; border-radius:12px; font-weight:650; min-height:44px; display:inline-flex; align-items:center; justify-content:center; gap:8px}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line)}
.btn.soft{background:var(--gold-2); color:var(--ink)}
.btn.danger{background:var(--bad); color:#fff}
.btn.sm{padding:7px 12px; min-height:36px; font-size:14px; font-weight:600}
.btn.block{width:100%}
.btn[disabled]{opacity:.45; cursor:default}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.grow{flex:1; min-width:0}
.pill{display:inline-flex; align-items:center; background:var(--bg-2); color:var(--ink); border-radius:999px; padding:2px 8px; font-size:12px; font-weight:650}
.pill.ok{background:color-mix(in srgb, var(--ok) 16%, transparent); color:var(--ok)}
.note{background:var(--bg-2); border-radius:14px; padding:12px 14px; font-size:14px; margin:0 0 14px}
.note.warn{background:var(--warn)}
.note a{color:var(--forest); font-weight:700}
input,select,textarea{width:100%; background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:11px 12px; outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--forest)}
textarea{min-height:150px; resize:vertical; line-height:1.55}
label{display:block; font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); margin:12px 0 6px}
.seg{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; margin:0 0 12px}
.seg button{flex:none; border:1px solid var(--line); background:var(--paper); color:var(--muted); border-radius:999px; padding:8px 12px; font-size:14px; font-weight:650; min-height:36px}
.seg button.on{background:var(--forest); color:var(--btn-ink); border-color:transparent}
.item{width:100%; text-align:left; display:flex; gap:12px; align-items:center; padding:12px 2px; border:0; border-bottom:1px solid var(--line); background:transparent; color:inherit; min-height:44px}
.item:last-child{border-bottom:0}
.mono{width:42px; height:42px; border-radius:12px; background:var(--gold-2); color:var(--forest); display:grid; place-items:center; font-family:var(--serif); font-weight:700; flex:none}
.chev{color:var(--muted); font-size:20px}
.phrase{display:flex; gap:8px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line)}
.phrase:last-of-type{border-bottom:0}
.en{font-family:var(--serif); font-weight:560; font-size:18px; letter-spacing:-.02em; line-height:1.35}
.fc{min-height:250px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; background:var(--paper); border:1px solid var(--line); border-radius:22px; padding:28px 20px; margin:12px 0; box-shadow:var(--shadow)}
.fc .t{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:12px}
.fc .f{font-family:var(--serif); font-size:30px; font-weight:560; letter-spacing:-.03em; line-height:1.2; white-space:pre-wrap}
.fc .b{font-size:18px; margin-top:14px; white-space:pre-wrap}
.prog{height:4px; background:var(--line); border-radius:99px; overflow:hidden; margin-top:8px}
.prog i{display:block; height:100%; background:var(--forest)}
.rate{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px}
.rate .btn{flex-direction:column; gap:0; min-height:64px}
.rate small{color:inherit; opacity:.8; font-size:11px; font-weight:500}
#micBtn.on{background:#c0392b;color:#fff;border-color:#c0392b;animation:micPulse 1.4s ease-in-out infinite}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,.55)}50%{box-shadow:0 0 0 7px rgba(192,57,43,0)}}
@media (prefers-reduced-motion:reduce){#micBtn.on{animation:none}}
.keys{display:none; text-align:center; margin-top:8px}
.ans{background:var(--bg); border-radius:12px; padding:12px 14px; margin:6px 0; white-space:pre-wrap; overflow-wrap:anywhere; font-family:var(--serif); font-size:18px; line-height:1.45}
.err{border:1px solid var(--line); border-radius:14px; padding:12px; margin:8px 0; background:var(--bg)}
.err .w{color:var(--bad); text-decoration:line-through}
.err .r{color:var(--ok); font-weight:700}
.q{border:1px solid var(--line); border-radius:14px; padding:14px; margin:10px 0; background:var(--bg)}
.opt{display:block; width:100%; text-align:left; background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:6px 0; color:inherit; min-height:44px}
.opt.good{border-color:var(--ok); background:color-mix(in srgb, var(--ok) 14%, var(--paper))}
.opt.bad{border-color:var(--bad); background:color-mix(in srgb, var(--bad) 12%, var(--paper))}
.why{font-size:14px; color:var(--muted); margin-top:6px}
.w-ok{color:var(--ok); font-weight:700}
.w-bad{color:var(--bad); font-weight:700; text-decoration:underline}
.plan{list-style:none; margin:0; padding:0; display:grid; gap:8px}
.plan button{width:100%; text-align:left; display:flex; gap:12px; align-items:center; background:var(--bg); border:1px solid var(--line); border-radius:14px; padding:12px; min-height:52px}
.plan button.done{background:color-mix(in srgb, var(--ok) 10%, var(--paper)); border-color:transparent}
.tick{width:22px; height:22px; border-radius:99px; border:1.5px solid var(--line); display:grid; place-items:center; flex:none; color:transparent}
.plan button.done .tick{background:var(--ok); border-color:var(--ok); color:#fff}
.wbars{display:flex; align-items:flex-end; gap:8px; height:108px}
.wcol{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:6px; height:100%; min-width:0}
.wcol i{display:block; width:100%; max-width:26px; border-radius:8px 8px 3px 3px; background:var(--forest); min-height:4px}
.wcol span{font-size:11px; color:var(--muted)}
.wcol.today span{color:var(--ink); font-weight:700}
.wcol.today i{background:var(--gold)}
.bars{display:flex; gap:6px; align-items:flex-end; height:64px; margin-top:10px}
.bars i{flex:1; background:var(--forest); border-radius:5px 5px 2px 2px; min-height:3px; opacity:.9}
.bars span{flex:1; text-align:center; font-size:10px; color:var(--muted)}
.heatwrap{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; max-width:100%}
.heatdays{display:grid; grid-template-rows:repeat(7,12px); gap:3px; font-size:9px; color:var(--muted); flex:none; padding-top:0}
.heatdays span{line-height:12px}
.heat{display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,12px); gap:3px}
.heat i,.legend i{width:12px; height:12px; border-radius:3px; background:var(--h0); display:block}
.heat i.lv1,.legend i.lv1{background:var(--h1)}
.heat i.lv2,.legend i.lv2{background:var(--h2)}
.heat i.lv3,.legend i.lv3{background:var(--h3)}
.heat i.lv4,.legend i.lv4{background:var(--h4)}
.heat i.fut{opacity:.35}
.legend{display:flex; align-items:center; gap:4px; margin-top:8px; color:var(--muted); font-size:11px}
.erow{margin:8px 0}
.erowtop{display:flex; justify-content:space-between; font-size:14px; gap:8px}
.ebar{height:6px; background:var(--bg); border-radius:99px; margin-top:4px; overflow:hidden}
.ebar i{display:block; height:100%; background:var(--forest); border-radius:99px}
.hitem{width:100%; text-align:left; display:flex; gap:10px; align-items:flex-start; padding:12px 0; border:0; border-bottom:1px solid var(--line); background:transparent; color:inherit}
.hitem:last-child{border-bottom:0}
.hico{width:34px; height:34px; border-radius:10px; background:var(--bg); display:grid; place-items:center; flex:none; color:var(--forest)}
.daylab{font-size:13px; font-weight:700; margin:14px 0 0}
.link{display:block; padding:12px 0; border-bottom:1px solid var(--line); text-decoration:none; color:inherit}
.link:last-child{border-bottom:0}
.src b{display:block}
.cmp{display:grid; gap:10px}
.navb,.tabb{color:inherit}
.tabbar{position:fixed; left:0; right:0; bottom:0; background:var(--paper); border-top:1px solid var(--line); z-index:12; padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar #tabNav{display:grid; grid-template-columns:repeat(5,1fr); max-width:640px; margin:0 auto}
.tabb{border:0; background:transparent; color:var(--muted); padding:8px 2px 10px; font-size:11px; font-weight:650; display:grid; gap:2px; justify-items:center; min-height:58px}
.tabb.on{color:var(--forest)}
.tabb svg,.navb svg,.iconbtn svg,.hico svg{display:block}
#dlg{position:fixed; inset:0; background:rgba(20,16,10,.48); z-index:40; display:grid; place-items:center; padding:16px}
#dlg[hidden]{display:none}
.dbox{background:var(--paper); border:1px solid var(--line); border-radius:18px; padding:18px; max-width:400px; width:100%; box-shadow:var(--shadow)}
#toast{position:fixed; left:50%; bottom:96px; transform:translateX(-50%) translateY(8px); background:#1c1915; color:#f6f1e7; padding:10px 14px; border-radius:999px; font-size:14px; opacity:0; pointer-events:none; transition:.2s; z-index:30; max-width:min(92vw,440px); text-align:center}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
a{color:var(--forest)}
.only-desktop{display:none}
svg{width:20px; height:20px}
@media (min-width:800px){
  .stats.cols3{grid-template-columns:repeat(3,1fr)}
  .split{grid-template-columns:1.15fr .85fr; align-items:start}
  .cmp{grid-template-columns:1fr 1fr}
  h1{font-size:52px}
}
@media (min-width:980px){
  body{padding:22px 18px; background:#e4d8c4; background-image:radial-gradient(rgba(28,25,21,.045) 0.7px, transparent 0.7px); background-size:5px 5px}
  .shell{display:grid; grid-template-columns:248px minmax(0,1fr); max-width:1120px; margin:0 auto; min-height:calc(100dvh - 44px); border-radius:28px; overflow:hidden; border:1px solid rgba(28,25,21,.08); box-shadow:0 30px 70px rgba(60,40,10,.14)}
  .side{display:flex; flex-direction:column; gap:8px; background:var(--sidebar); color:var(--side-fg); padding:22px 14px 16px; position:sticky; top:0; height:calc(100dvh - 44px)}
  .brand{display:flex; gap:10px; align-items:center; padding:0 8px 12px}
  .brand small{color:var(--side-muted); font-size:12px}
  .brand .brandmark{font-size:20px; color:var(--side-fg)}
  .brand .brandmark i{color:#e4c07a}
  .mark{width:40px; height:40px; border-radius:12px; background:#143528; color:#f3e6cf; display:grid; place-items:center; font-family:var(--serif); font-weight:700; border:1px solid rgba(243,230,207,.2)}
  .sidenav{display:flex; flex-direction:column; gap:4px}
  .navb{display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:transparent; color:var(--side-muted); border:0; border-radius:12px; padding:10px 12px; font-weight:600; min-height:44px}
  .navb.on{background:rgba(255,255,255,.1); color:#fff}
  .navgap{height:8px}
  .sidefoot{margin-top:auto; padding:12px; border-top:1px solid rgba(255,255,255,.1)}
  .side-streak{display:flex; align-items:baseline; gap:8px}
  .side-streak b{font-family:var(--serif); font-size:36px; font-weight:560; letter-spacing:-.03em; line-height:1}
  .side-streak span,.side-ai{color:var(--side-muted); font-size:12px}
  .side-ai{margin-top:4px}
  .tabbar{display:none}
  .only-mobile{display:none}
  .only-desktop{display:initial}
  .top{padding:22px 28px 0; background:transparent; backdrop-filter:none; position:static}
  main{padding:6px 28px 36px}
  .keys{display:block}
  #toast{bottom:28px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important}
  .btn:active{transform:none}
}

/* ---- sampul ---- */
:root{--cv-bg:#14352a;--cv-ink:#f6f1e7;--cv-mute:#bcd2c1;--cv-gold:#e8c98b;--cv-btn:#f3e6cf;--cv-btn-ink:#14352a}
html.cv-on,html.cv-on body{overflow:hidden}
#cover{position:fixed;inset:0;z-index:60;background:var(--cv-bg);color:var(--cv-ink);overflow:hidden;opacity:1;visibility:visible;transition:opacity .35s ease,visibility 0s}
#cover[hidden]{display:none}
#cover.out{opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s .35s}
#cover .cv-in{position:relative;z-index:1;width:min(100%,760px);height:100%;margin:0 auto;display:flex;flex-direction:column;justify-content:space-between;gap:24px;
  padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
#cover .cv-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--cv-mute)}
#cover .cv-mid{min-width:0}
#cover .cv-kick{margin:0 0 14px;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--cv-gold)}
#cover .cv-title{font-family:var(--serif);font-weight:560;font-size:clamp(64px,19vw,140px);line-height:.92;letter-spacing:-.04em;margin:0 0 18px;color:var(--cv-ink);text-wrap:balance}
#cover .cv-title em{font-style:italic;color:var(--cv-gold);font-weight:560}
#cover .cv-sub{margin:0;max-width:34ch;font-size:18px;line-height:1.45;color:var(--cv-mute)}
#cover .cv-bot{display:grid;gap:18px}
#cover .cv-phrase{border-top:1px solid rgba(232,201,139,.35);padding-top:16px;display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center}
#cover .cv-label{grid-column:1/-1;margin:0 0 4px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--cv-gold)}
#cover .cv-en{margin:0;font-family:var(--serif);font-style:italic;font-weight:560;font-size:clamp(22px,5.4vw,30px);line-height:1.2;color:var(--cv-ink);min-width:0}
#cover .cv-id{grid-column:1;margin:0;font-size:14px;color:var(--cv-mute)}
#cover .cv-say{grid-row:2/4;grid-column:2;width:44px;height:44px;border-radius:50%;border:1px solid rgba(232,201,139,.55);background:transparent;color:var(--cv-gold);display:grid;place-items:center}
#cover .cv-say svg{width:20px;height:20px;display:block}
#cover .cv-go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border:0;border-radius:16px;background:var(--cv-btn);color:var(--cv-btn-ink);font-weight:700;font-size:18px;letter-spacing:.01em}
