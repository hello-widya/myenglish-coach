/* ---- tenses course: 16 tenses + 5 comparisons ---- */
const wq=(q,target)=>({t:"w",q:q,target:target||""});
const TLESSONS=[
/* ===== PRESENT ===== */
{id:"t01",topic:"tenses",fam:"present",lv:"A1",tag:"core",et:"tense",t:"Present Simple",g:"Habits, facts, and fixed schedules.",
ex:"**Rumus**\n• (+) S + V1 (he / she / it + V-s / es)\n• (−) S + do / does + not + V1\n• (?) Do / Does + S + V1?\n**Dipakai untuk**: kebiasaan, fakta umum, jadwal tetap.\n**Penanda**: always, usually, often, sometimes, never, every day, on Mondays.\n**Beda dengan bahasa Indonesia**: verb tidak berubah menurut waktu, tapi he / she / it wajib + s.\n**Kesalahan umum**: ✗ She work here. ✓ She **works** here. ✗ Does she works? ✓ Does she **work**?",
ph:[["I work from home every day.","Saya bekerja dari rumah setiap hari."],["She doesn't drink coffee.","Dia tidak minum kopi."],["Water boils at 100 degrees.","Air mendidih pada 100 derajat."],["The shop opens at nine.","Tokonya buka jam sembilan."]],
q:[mq("Water ____ at 100°C.",["boil","boils","is boiling"],1,"Fakta umum → present simple. Water = it → boils."),
mq("My sister ____ in Jakarta.",["live","lives","is live"],1,"she → verb + s."),
mq("____ they work on Sundays?",["Do","Does","Are"],0,"they → Do."),
fq("He ____ spicy food. (not like)","doesn't like|does not like","he → doesn't + verb dasar."),
fq("The train ____ at 8 a.m. every day. (leave)","leaves","Jadwal tetap, the train = it → leaves."),
xq("She don't works here.","She doesn't work here.","doesn't + verb dasar, tanpa -s."),
oq("I usually drink tea in the morning."),
wq("Write 2 sentences about your daily routine using the present simple.","present simple")]},

{id:"t02",topic:"tenses",fam:"present",lv:"A1",tag:"core",et:"tense",t:"Present Continuous",g:"What is happening now or around now.",
ex:"**Rumus**\n• (+) S + am / is / are + V-ing\n• (−) S + am / is / are + not + V-ing\n• (?) Am / Is / Are + S + V-ing?\n**Dipakai untuk**: yang sedang terjadi sekarang, kegiatan sementara, rencana dekat yang sudah pasti.\n**Penanda**: now, right now, at the moment, today, currently, look!, listen!\n**Verb stative** (know, like, want, need, understand) biasanya tidak pakai -ing: ✗ I am knowing. ✓ I **know**.\n**Ejaan**: run → running, write → writing, study → studying.\n**Kesalahan umum**: ✗ She is work now. ✓ She is **working** now.",
ph:[["I'm working on a report right now.","Saya sedang mengerjakan laporan sekarang."],["Are you listening?","Apakah kamu mendengarkan?"],["It's raining, so I'm staying home.","Hujan, jadi saya di rumah."],["We're meeting the client tomorrow.","Kami bertemu klien besok."]],
q:[mq("Please be quiet. The baby ____.",["sleeps","is sleeping","sleep"],1,"Sedang terjadi sekarang → is sleeping."),
mq("I ____ what you mean.",["am understanding","understand","understanding"],1,"understand = stative, tidak pakai -ing."),
mq("Look! They ____ football.",["play","are playing","plays"],1,"Look! → sedang terjadi."),
fq("She ____ an email at the moment. (write)","is writing|'s writing","is + V-ing; write → writing."),
fq("We ____ in the park now. (run)","are running|'re running","run → running (konsonan digandakan)."),
xq("He is work from home today.","He is working from home today.","is + V-ing."),
oq("What are you doing right now?"),
wq("Write 2 sentences: what you are doing right now, and what you are doing this week.","present continuous")]},

{id:"t03",topic:"tenses",fam:"present",lv:"B1",tag:"core",et:"tense",t:"Present Perfect",g:"Experience, results, and things that connect to now.",
ex:"**Rumus**\n• (+) S + have / has + V3 (past participle)\n• (−) S + have / has + not + V3\n• (?) Have / Has + S + V3?\n**Dipakai untuk**: pengalaman (ever, never), hasil yang terlihat sekarang, kejadian baru (just, already, yet), keadaan yang mulai dulu dan berlanjut (since, for).\n**Penanda**: ever, never, already, yet, just, recently, so far, since, for.\n**Jangan** dipakai dengan waktu yang sudah selesai: ✗ I have seen him yesterday. ✓ I **saw** him yesterday.\n**Beda dengan bahasa Indonesia**: 'sudah' tidak selalu present perfect. Kalau ada waktu lampau yang jelas, pakai past simple.\n**Kesalahan umum**: ✗ I have went. ✓ I have **gone**. ✗ She has finish. ✓ She has **finished**.",
ph:[["I've already sent the invoice.","Saya sudah mengirim tagihannya."],["Have you ever been to Bali?","Pernahkah kamu ke Bali?"],["She hasn't replied yet.","Dia belum membalas."],["We've worked together since 2023.","Kami bekerja bersama sejak 2023."]],
q:[mq("Have you ever ____ sushi?",["eat","ate","eaten"],2,"have + V3: eaten."),
mq("She ____ the report yet.",["hasn't finished","didn't finished","hasn't finish"],0,"has not + V3."),
mq("Choose the correct sentence.",["I have seen him yesterday.","I saw him yesterday.","I have saw him yesterday."],1,"yesterday = waktu selesai → past simple."),
fq("I've already ____ the email. (send)","sent","V3 dari send = sent."),
fq("He ____ in this company since 2020. (work)","has worked|has been working","since + present perfect."),
xq("I have went to Bali twice.","I have gone to Bali twice.|I have been to Bali twice.","have + V3 (gone / been)."),
oq("Have you finished the report yet?"),
wq("Write 2 sentences: one experience you have had, and one thing you have never done.","present perfect")]},

{id:"t04",topic:"tenses",fam:"present",lv:"B1",tag:"core",et:"tense",t:"Present Perfect Continuous",g:"How long something has been going on.",
ex:"**Rumus**\n• (+) S + have / has + been + V-ing\n• (−) S + have / has + not + been + V-ing\n• (?) Have / Has + S + been + V-ing?\n**Dipakai untuk**: aksi yang mulai dulu dan masih berlangsung, dengan fokus pada **durasi / proses**. Juga untuk yang baru berhenti dan hasilnya terlihat (You look tired. Have you been running?).\n**Penanda**: for, since, all day, lately, recently, how long.\n**Beda dengan present perfect**: PP fokus hasil / jumlah (I have written 3 emails). PPC fokus durasi (I have been writing emails all morning).\n**Stative verb** tidak dipakai: ✗ I have been knowing him. ✓ I have **known** him.\n**Kesalahan umum**: ✗ I am waiting since 8. ✓ I **have been waiting** since 8.",
ph:[["I've been waiting for your reply since Monday.","Saya menunggu balasan Anda sejak Senin."],["How long have you been learning English?","Sudah berapa lama kamu belajar bahasa Inggris?"],["She's been working all day.","Dia bekerja seharian."],["It has been raining a lot lately.","Belakangan sering hujan."]],
q:[mq("I ____ for two hours.",["study","have been studying","am studying"],1,"for two hours + masih berlangsung → have been studying."),
mq("How long ____ you ____ here?",["have / been working","did / working","are / work"],0,"How long + present perfect continuous."),
mq("I ____ this phone since 2022.",["have been having","have had","am having"],1,"have (memiliki) = stative → have had."),
fq("We ____ since 9 a.m. (wait)","have been waiting|'ve been waiting","since + have been + V-ing."),
fq("It ____ raining all morning.","has been","it → has been."),
xq("I am waiting for you since 8.","I have been waiting for you since 8.|I've been waiting for you since 8.","since → have been waiting."),
oq("She has been working here for three years."),
wq("Write 2 sentences: how long you have been learning English, and something you have been doing lately.","present perfect continuous")]},

/* ===== PAST ===== */
{id:"t05",topic:"tenses",fam:"past",lv:"A2",tag:"core",et:"tense",t:"Past Simple",g:"Finished events at a clear time in the past.",
ex:"**Rumus**\n• (+) S + V2 (regular: V-ed, irregular: went, had, saw, bought)\n• (−) S + did not + V1\n• (?) Did + S + V1?\n**Dipakai untuk**: kejadian yang selesai pada waktu lampau yang jelas.\n**Penanda**: yesterday, last week, two days ago, in 2020, when.\n**Verb to be**: was / were (tanpa did).\n**Kesalahan umum**: ✗ Did you went? ✓ Did you **go**? ✗ I didn't saw it. ✓ I didn't **see** it.",
ph:[["I sent the file yesterday.","Saya mengirim file kemarin."],["We didn't have time.","Kami tidak punya waktu."],["Did you see my message?","Apakah kamu melihat pesanku?"],["She was tired after the trip.","Dia lelah setelah perjalanan."]],
q:[mq("I ____ to the office last Friday.",["go","went","have gone"],1,"last Friday → past simple: went."),
mq("____ you finish the report?",["Did","Do","Have"],0,"Did + S + V1."),
mq("They ____ at home yesterday.",["was not","were not","didn't be"],1,"they → were not."),
fq("She ____ a new laptop last week. (buy)","bought","buy → bought."),
fq("We didn't ____ the meeting. (attend)","attend","didn't + V1."),
xq("I didn't saw the email.","I didn't see the email.","didn't + V1."),
oq("We visited my grandmother last weekend."),
wq("Write 3 sentences about what you did yesterday.","past simple")]},

{id:"t06",topic:"tenses",fam:"past",lv:"A2",tag:"core",et:"tense",t:"Past Continuous",g:"What was in progress at a moment in the past.",
ex:"**Rumus**\n• (+) S + was / were + V-ing\n• (−) S + was / were + not + V-ing\n• (?) Was / Were + S + V-ing?\n**Dipakai untuk**: aksi yang sedang berlangsung pada waktu tertentu di masa lalu, latar cerita, dan aksi yang dipotong aksi lain.\n**Pola**: While / when + past continuous, past simple (aksi pendek memotong).\n**Penanda**: while, when, at 8 p.m. last night, all day.\n**Kesalahan umum**: ✗ I was watch TV. ✓ I was **watching** TV. Verb stative tidak dipakai (✗ I was knowing).",
ph:[["I was working at nine last night.","Saya sedang bekerja jam sembilan semalam."],["While I was cooking, the phone rang.","Saat saya memasak, telepon berdering."],["They were talking when I arrived.","Mereka sedang bicara ketika saya tiba."],["What were you doing at 8 p.m.?","Kamu sedang apa jam 8 malam?"]],
q:[mq("I ____ TV when you called.",["watched","was watching","were watching"],1,"Sedang berlangsung saat dipotong → was watching."),
mq("The phone rang while I ____ a shower.",["took","was taking","am taking"],1,"while + past continuous."),
mq("Which sentence is correct?",["They was talking.","They were talking.","They were talk."],1,"they → were + V-ing."),
fq("They ____ when the alarm went off. (sleep)","were sleeping","were + V-ing."),
fq("I ____ when he explained it. (not listen)","wasn't listening|was not listening","wasn't + V-ing."),
xq("I was watch TV when you called.","I was watching TV when you called.","was + V-ing."),
oq("I was reading when the lights went out."),
wq("Write 2 sentences: what you were doing at 8 p.m. last night, and one action that was interrupted (use when or while).","past continuous")]},

{id:"t07",topic:"tenses",fam:"past",lv:"B1",tag:"core",et:"tense",t:"Past Perfect",g:"The earlier of two past events.",
ex:"**Rumus**\n• (+) S + had + V3\n• (−) S + had not (hadn't) + V3\n• (?) Had + S + V3?\n**Dipakai untuk**: aksi yang terjadi **lebih dulu** sebelum aksi lampau lain.\n**Penanda**: before, after, by the time, already, just, never … before.\n**Contoh**: When I arrived, the meeting **had started**. (rapat mulai dulu, saya tiba kemudian)\n**Kesalahan umum**: ✗ had went. ✓ had **gone**. ✗ had finish. ✓ had **finished**.",
ph:[["When I arrived, the meeting had already started.","Ketika saya tiba, rapat sudah dimulai."],["She had never seen snow before that trip.","Dia belum pernah melihat salju sebelum perjalanan itu."],["I realised I had forgotten the file.","Saya sadar saya lupa file-nya."],["After we had eaten, we left.","Setelah kami makan, kami pergi."]],
q:[mq("When we got there, the film ____.",["started","had started","has started"],1,"Film mulai lebih dulu → had started."),
mq("He was tired because he ____ all night.",["had worked","has worked","works"],0,"Lebih dulu dari 'was tired' → had + V3."),
mq("By the time I called, she ____ already ____.",["had / left","has / left","was / leaving"],0,"had + V3."),
fq("I ____ before the meeting, so I was hungry. (not eat)","hadn't eaten|had not eaten","had not + V3."),
fq("After she ____ the report, she went home. (finish)","had finished","had + V3."),
xq("She had went home before I arrived.","She had gone home before I arrived.","had + V3: gone."),
oq("They had already left when I arrived."),
wq("Write 2 sentences: something that had already happened when you woke up today, and something you had not done before this week.","past perfect")]},

{id:"t08",topic:"tenses",fam:"past",lv:"B2",tag:"core",et:"tense",t:"Past Perfect Continuous",g:"A longer action that came before a past moment.",
ex:"**Form**\n• (+) S + had been + V-ing\n• (−) S + had not been + V-ing\n• (?) Had + S + been + V-ing?\n**Use**: an action that was in progress for some time **before** another past moment; often explains a cause or a state. *She was exhausted because she had been working for ten hours.*\n**Signals**: for, since, all day, how long, before.\n**Compare**: past perfect = completed before (*I had finished*). Past perfect continuous = duration or process (*I had been working*).\n**Common error**: leaving out *been*: ✗ She had working. ✓ She had **been** working. Stative verbs are not used with -ing.",
ph:[["I had been waiting for an hour when she finally arrived.","Saya sudah menunggu sejam ketika dia akhirnya tiba."],["His eyes were red because he had been crying.","Matanya merah karena dia habis menangis."],["How long had you been working there before you quit?","Berapa lama kamu bekerja di sana sebelum berhenti?"],["We had been driving for hours when the car broke down.","Kami sudah menyetir berjam-jam saat mobil mogok."]],
q:[mq("She was exhausted because she ____ for ten hours.",["had been working","has been working","was worked"],0,"Duration before a past moment."),
mq("They ____ for two hours when it started to rain.",["had been walking","have been walking","were walk"],0,"had been + V-ing."),
mq("Which sentence emphasises duration?",["I had finished the book.","I had been reading the book for three hours.","I read the book."],1,"had been + V-ing + for."),
fq("I ____ for an hour before she arrived. (wait)","had been waiting|'d been waiting","had been + V-ing."),
fq("How long had you ____ there before you left? (be + work)","been working","had + been + V-ing."),
xq("She had been work all day, so she was tired.","She had been working all day, so she was tired.","had been + V-ing."),
oq("He had been studying for hours before the exam."),
wq("Write 2 sentences with the past perfect continuous that explain why someone was tired or upset.","past perfect continuous")]},

/* ===== FUTURE ===== */
{id:"t09",topic:"tenses",fam:"future",lv:"A2",tag:"core",et:"tense",t:"Future Simple (will)",g:"Promises, offers, spontaneous decisions, predictions.",
ex:"**Rumus**\n• (+) S + will + V1 ('ll)\n• (−) S + will not (won't) + V1\n• (?) Will + S + V1?\n**Dipakai untuk**: keputusan spontan, janji, tawaran, prediksi berdasarkan pendapat (I think …).\n**Penanda**: tomorrow, next week, probably, I think, maybe.\n**Beda dengan going to**: rencana yang sudah diputuskan → be going to. Lihat pelajaran perbandingan.\n**Kesalahan umum**: ✗ I will to call you. ✓ I will **call** you. ✗ I will calling. ✓ I will call.",
ph:[["I'll send it tomorrow.","Saya akan kirim besok."],["I'll help you with that.","Saya akan bantu."],["I think it will rain tonight.","Saya kira akan hujan malam ini."],["Will you be available on Friday?","Apakah kamu akan tersedia hari Jumat?"]],
q:[mq("'I'm cold.' — 'I ____ close the window.'",["will","am going to","am closing"],0,"Keputusan spontan → will."),
mq("I think she ____ the job.",["will get","got","gets"],0,"Prediksi (I think) → will."),
mq("Which is correct?",["I will to call you.","I will call you.","I will calling you."],1,"will + V1."),
fq("I ____ your birthday. I promise. (not forget)","won't forget|will not forget","Janji → will not + V1."),
fq("I'm sure our client ____ the proposal. (like)","will like|'ll like","Prediksi → will + V1."),
xq("I will to send you the file tomorrow.","I will send you the file tomorrow.|I'll send you the file tomorrow.","will + V1, tanpa to."),
oq("I will send you the file tomorrow."),
wq("Write 3 sentences: one promise, one prediction about next year, and one offer to help someone.","future simple")]},

{id:"t10",topic:"tenses",fam:"future",lv:"B1",tag:"core",et:"tense",t:"Future Continuous",g:"What will be in progress at a future time.",
ex:"**Rumus**\n• (+) S + will be + V-ing\n• (−) S + will not be + V-ing\n• (?) Will + S + be + V-ing?\n**Dipakai untuk**: aksi yang akan **sedang berlangsung** pada waktu tertentu di masa depan, dan untuk menanyakan rencana orang dengan sopan (Will you be using the car tonight?).\n**Penanda**: this time tomorrow, at 5 p.m. next Monday, this time next week.\n**Kesalahan umum**: ✗ I will working. ✓ I will **be working**.",
ph:[["This time next week, I'll be flying to Bali.","Minggu depan jam segini saya sedang terbang ke Bali."],["I'll be working at nine, so call me later.","Jam sembilan saya sedang bekerja, jadi telepon nanti."],["Will you be using the laptop this afternoon?","Apakah kamu akan memakai laptop sore ini?"],["At noon tomorrow, we will be meeting the client.","Besok siang kami sedang bertemu klien."]],
q:[mq("This time tomorrow, we ____ to Bali.",["will be flying","fly","flew"],0,"Sedang berlangsung pada waktu tertentu di masa depan."),
mq("Which sentence is correct?",["I will working at nine.","I will be working at nine.","I will be work at nine."],1,"will be + V-ing."),
mq("Politely asking about plans: '____ you ____ the car tonight?'",["Will / be using","Do / using","Are / use"],0,"Will + S + be + V-ing."),
fq("At 10 a.m. tomorrow, I ____ the client. (meet)","will be meeting|'ll be meeting","will be + V-ing."),
fq("This time next month, she ____ in London. (study)","will be studying|'ll be studying","will be + V-ing."),
xq("I will be work at five tomorrow.","I will be working at five tomorrow.|I'll be working at five tomorrow.","will be + V-ing."),
oq("This time next week I will be flying to Bali."),
wq("Write 2 sentences about what you will be doing at this time next week.","future continuous")]},

{id:"t11",topic:"tenses",fam:"future",lv:"B2",tag:"core",et:"tense",t:"Future Perfect",g:"What will be finished by a future deadline.",
ex:"**Form**\n• (+) S + will have + V3\n• (−) S + will not have + V3\n• (?) Will + S + have + V3?\n**Use**: an action that will be **completed before** a point in the future (a deadline). *By Friday, I will have finished the report.*\n**Signals**: by, by then, by the time, before.\n**Compare**: future simple = it happens (*I will finish it*). Future perfect = it is already done by then.\n**Common error**: ✗ will have finish. ✓ will have **finished**.",
ph:[["By Friday, I will have finished the report.","Pada hari Jumat saya sudah menyelesaikan laporannya."],["By the time you arrive, we will have left.","Saat kamu tiba, kami sudah pergi."],["She will have worked here for ten years in June.","Pada bulan Juni dia sudah bekerja di sini sepuluh tahun."],["Will you have finished by noon?","Apakah kamu sudah selesai sebelum siang?"]],
q:[mq("By next June, I ____ English for five years.",["will have studied","will study","study"],0,"By + time → will have + V3."),
mq("By the time you read this, I ____ the city.",["will have left","leave","left"],0,"Completed before a future moment."),
mq("Which sentence shows a deadline?",["I will finish it.","I will have finished it by Friday.","I am finishing it."],1,"will have + V3 + by."),
fq("By 5 p.m., they ____ the project. (complete)","will have completed|'ll have completed","will have + V3."),
fq("By the end of the year, I ____ enough money. (save)","will have saved|'ll have saved","will have + V3."),
xq("I will have finish it by Monday.","I will have finished it by Monday.|I'll have finished it by Monday.","will have + V3."),
oq("By Friday I will have finished the report."),
wq("Write 2 sentences about what you will have achieved by the end of next year.","future perfect")]},

{id:"t12",topic:"tenses",fam:"future",lv:"B2",tag:"core",et:"tense",t:"Future Perfect Continuous",g:"How long something will have been going on by a future time.",
ex:"**Form**\n• (+) S + will have been + V-ing\n• (−) S + will not have been + V-ing\n• (?) Will + S + have been + V-ing?\n**Use**: the **duration** of an action up to a future point. *By June, I will have been working here for ten years.*\n**Signals**: by + time + for.\n**Note**: this tense is rare. Use it when you want to stress how long something will have lasted. Stative verbs are not used with -ing.\n**Common error**: dropping *been*: ✗ will have working. ✓ will have **been** working.",
ph:[["By next month, I will have been learning English for a year.","Bulan depan saya sudah belajar bahasa Inggris selama setahun."],["In June, she will have been working here for ten years.","Bulan Juni dia sudah bekerja di sini selama sepuluh tahun."],["By noon, we will have been driving for six hours.","Saat siang kami sudah menyetir enam jam."],["How long will you have been living here by then?","Berapa lama kamu sudah tinggal di sini saat itu?"]],
q:[mq("By 2030, she ____ here for ten years.",["will have been working","will work","has been working"],0,"Duration up to a future point."),
mq("Which sentence emphasises duration up to a future point?",["I will have finished the course.","I will have been studying for two years by June.","I will study in June."],1,"will have been + V-ing + for."),
mq("Choose the correct form.",["will have been wait","will have been waiting","will been waiting"],1,"will have been + V-ing."),
fq("By next month, I ____ English for a year. (learn)","will have been learning|'ll have been learning","will have been + V-ing."),
fq("By noon, we ____ driving for six hours. (be)","will have been|'ll have been","will have been driving."),
xq("By June, she will have been work here for ten years.","By June, she will have been working here for ten years.","will have been + V-ing."),
oq("By June I will have been working here for ten years."),
wq("Write 2 sentences with the future perfect continuous about a habit or job you will have kept for a long time.","future perfect continuous")]},

/* ===== PAST FUTURE (bonus) ===== */
{id:"t13",topic:"tenses",fam:"pastfuture",lv:"B2",tag:"core",et:"tense",t:"Past Future Simple (would)",g:"The future as seen from the past, mostly in reported speech.",
ex:"**Form**\n• (+) S + would + V1\n• (−) S + would not (wouldn't) + V1\n• (?) Would + S + V1?\n**Use**: the future seen from a point in the past. Common in reported speech and in stories. *She said she would call me. I knew you would like it.*\n**Note**: this is the 'past future' form taught in Indonesian schools. English grammar usually treats it as *would* for the future in the past.\n**Common error**: ✗ She said she will call (when you report something said in the past and it did not happen).",
ph:[["She said she would call me back.","Dia bilang akan menelepon balik."],["I knew you would like it.","Saya tahu kamu akan suka."],["He promised he wouldn't be late.","Dia berjanji tidak akan terlambat."],["They thought it would rain.","Mereka kira akan hujan."]],
q:[mq("Last week she said she ____ me back, but she never did.",["would call","will call","calls"],0,"Dilaporkan di masa lalu → would."),
mq("I thought it ____ easy, but it was hard.",["would be","will be","is"],0,"would be."),
mq("Which sentence is correct?",["He promised he would help.","He promised he would to help.","He promised he woulds help."],0,"would + V1."),
fq("She told me she ____ later, but she didn't. (call)","would call|'d call","would + V1."),
fq("I knew they ____. (not agree)","wouldn't agree|would not agree","would not + V1."),
xq("Last night he promised he will help me.","Last night he promised he would help me.","Promised di masa lalu → would."),
oq("He said he would arrive at noon."),
wq("Write 2 sentences with would: something someone promised in the past, and something you expected that did not happen.","past future simple")]},

{id:"t14",topic:"tenses",fam:"pastfuture",lv:"B2",tag:"core",et:"tense",t:"Past Future Continuous",g:"What would be in progress at a later time, seen from the past.",
ex:"**Form**\n• (+) S + would be + V-ing\n• (−) S + would not be + V-ing\n• (?) Would + S + be + V-ing?\n**Use**: an action that would be in progress at a later moment, seen from the past. *She said she would be waiting outside.*\n**Note**: a 'past future' form from the Indonesian school list. Mostly used in reported speech.\n**Common error**: dropping *be*: ✗ She said she would waiting. ✓ She said she would **be** waiting.",
ph:[["She said she would be waiting outside.","Dia bilang dia akan menunggu di luar."],["I knew we would be working late that night.","Saya tahu kami akan lembur malam itu."],["He told me he would be traveling next week.","Dia bilang dia akan bepergian minggu depan."],["They said they would be using the room at noon.","Mereka bilang mereka akan memakai ruangan itu siang nanti."]],
q:[mq("He said he ____ for me at the station, but he wasn't there.",["would be waiting","will be waiting","is waiting"],0,"would be + V-ing."),
mq("I knew we ____ late that night.",["would be working","will be working","are working"],0,"Past future continuous."),
mq("Which is correct?",["She said she would waiting.","She said she would be waiting.","She said she would waits."],1,"would be + V-ing."),
fq("She said she ____ outside, but I didn't see her. (wait)","would be waiting|'d be waiting","would be + V-ing."),
fq("He told me he ____ the next week. (travel)","would be traveling|would be travelling|'d be traveling|'d be travelling","would be + V-ing."),
xq("He said he would working late.","He said he would be working late.","would be + V-ing."),
oq("She said she would be waiting outside."),
wq("Write 2 sentences with would be + verb-ing, reporting what someone said about their plans.","past future continuous")]},

{id:"t15",topic:"tenses",fam:"pastfuture",lv:"B2",tag:"core",et:"tense",t:"Past Future Perfect",g:"Completed before a later point, or imagined past results.",
ex:"**Form**\n• (+) S + would have + V3\n• (−) S + would not have + V3\n• (?) Would + S + have + V3?\n**Use**: (1) something that would have been completed by a later time, seen from the past: *He said he would have finished by Friday.* (2) the result in the **third conditional**: *If I had known, I would have called you.*\n**Common error**: ✗ would have went. ✓ would have **gone**. ✗ if I would have known. ✓ if I **had known**.",
ph:[["He said he would have finished by Friday.","Dia bilang dia sudah selesai pada hari Jumat."],["I thought she would have arrived by then.","Saya kira dia sudah tiba saat itu."],["If I had known, I would have called you.","Kalau saya tahu, saya pasti sudah menelepon."],["They would have won if they had trained harder.","Mereka pasti menang kalau berlatih lebih keras."]],
q:[mq("If I had left earlier, I ____ the train.",["would have caught","would catch","will have caught"],0,"Third conditional: would have + V3."),
mq("He said last week he ____ the report by Friday, but he was late.",["would have finished","will have finished","has finished"],0,"would have + V3."),
mq("Which sentence is correct?",["She would have gone if she knew.","She would have gone if she had known.","She would gone if she had known."],1,"if + had + V3, would have + V3."),
fq("If we had known, we ____ earlier. (come)","would have come|'d have come","would have + V3."),
fq("They ____ if they had trained harder. (win)","would have won|'d have won","would have + V3."),
xq("I would have went if you invited me.","I would have gone if you had invited me.","would have + V3 dan had + V3."),
oq("If I had known, I would have called you."),
wq("Write 2 sentences with would have + V3 about something you would have done differently.","past future perfect")]},

{id:"t16",topic:"tenses",fam:"pastfuture",lv:"B2",tag:"core",et:"tense",t:"Past Future Perfect Continuous",g:"Duration seen from the past, or imagined ongoing past actions.",
ex:"**Form**\n• (+) S + would have been + V-ing\n• (−) S + would not have been + V-ing\n• (?) Would + S + have been + V-ing?\n**Use**: (1) a duration that would have lasted up to a later point, seen from the past: *She said that by June she would have been working there for ten years.* (2) imagined ongoing actions in the past: *If it hadn't rained, we would have been playing outside.*\n**Note**: very rare outside reported speech and conditionals.\n**Common error**: ✗ would have been work. ✓ would have been **working**.",
ph:[["She said that by June she would have been working here for ten years.","Dia bilang pada bulan Juni dia sudah bekerja di sini sepuluh tahun."],["If it hadn't rained, we would have been playing outside.","Kalau tidak hujan, kami pasti sedang bermain di luar."],["I thought he would have been waiting for hours.","Saya kira dia sudah menunggu berjam-jam."],["By then, they would have been living there for a decade.","Saat itu mereka sudah tinggal di sana sepuluh tahun."]],
q:[mq("If it hadn't rained, we ____ outside all afternoon.",["would have been playing","would play","will have been playing"],0,"Imagined past duration."),
mq("Which form is the past future perfect continuous?",["would have been working","would be working","would have worked"],0,"would have been + V-ing."),
mq("She said in January that by June she ____ here for a year.",["would have been working","has been working","works"],0,"Duration seen from the past."),
fq("If I hadn't been ill, I ____ all week. (work)","would have been working|'d have been working","would have been + V-ing."),
fq("I thought she ____ for hours. (wait)","would have been waiting|'d have been waiting","would have been + V-ing."),
xq("She would have been work there for ten years.","She would have been working there for ten years.","would have been + V-ing."),
oq("She said she would have been working there for ten years."),
wq("Write 2 sentences using would have been + verb-ing (reported or imagined).","past future perfect continuous")]},

/* ===== COMPARISONS ===== */
{id:"c1",topic:"tenses",fam:"compare",lv:"B1",tag:"core",et:"tense",t:"Present Perfect vs Past Simple",g:"Choose by time: finished time or connected to now.",
ex:"**Past simple**: ada waktu lampau yang selesai (yesterday, last week, ago, in 2020, when).\n**Present perfect**: tanpa waktu spesifik, atau periode yang belum selesai (this week, today, so far), dan hubungan dengan sekarang (ever, never, already, yet, since, for).\n**Tes cepat**: ada waktu selesai? → past simple. Periode belum selesai atau pengalaman tanpa waktu? → present perfect.\n✗ I have seen him yesterday. ✓ I **saw** him yesterday.\n✗ I saw him many times in my life. ✓ I **have seen** him many times.",
ph:[["I sent the invoice yesterday.","Saya mengirim tagihannya kemarin."],["I've already sent the invoice.","Saya sudah mengirim tagihannya."],["Did you see him last night?","Kamu melihatnya semalam?"],["Have you seen him today?","Kamu sudah melihatnya hari ini?"]],
q:[mq("I ____ him two days ago.",["saw","have seen","have been seeing"],0,"two days ago → past simple."),
mq("We ____ three emails so far today.",["sent","have sent","were sending"],1,"so far today (belum selesai) → present perfect."),
mq("She ____ here in 2019.",["started","has started","has been start"],0,"in 2019 → past simple."),
fq("We ____ to Makassar in 2021. (move)","moved","in 2021 → past simple."),
fq("I ____ the report yet. (not finish)","haven't finished|have not finished","yet → present perfect."),
xq("I have seen him yesterday.","I saw him yesterday.","yesterday → past simple."),
oq("I met her last year."),
wq("Write one sentence in the past simple and one in the present perfect about the same topic, for example a trip.","present perfect vs past simple")]},

{id:"c2",topic:"tenses",fam:"compare",lv:"A2",tag:"core",et:"tense",t:"Past Simple vs Past Continuous",g:"Finished actions versus actions in progress.",
ex:"**Past simple**: aksi selesai atau berurutan. *I opened the door, walked in, and sat down.*\n**Past continuous**: aksi yang sedang berlangsung, atau latar. *I was cooking when she called.*\n**Pola**: aksi panjang (past continuous) + aksi pendek yang memotong (past simple).\n*While we were walking, it started to rain.*\n✗ I was opening the door, walking in, and sitting down. (urutan aksi → past simple)",
ph:[["I was cooking when she called.","Saya sedang memasak ketika dia menelepon."],["I opened the door and walked in.","Saya membuka pintu dan masuk."],["While we were walking, it started to rain.","Saat kami berjalan, hujan mulai turun."],["It rained all night.","Hujan semalaman."]],
q:[mq("I ____ the door, walked in, and sat down.",["opened","was opening","have opened"],0,"Urutan aksi selesai → past simple."),
mq("While we ____, it started to rain.",["were walking","walked","walk"],0,"Aksi panjang yang dipotong."),
mq("They ____ TV when the power went out.",["watched","were watching","watch"],1,"Sedang berlangsung saat dipotong."),
fq("I ____ dinner when you called. (cook)","was cooking","Aksi yang sedang berlangsung."),
fq("She ____ the email and closed her laptop. (send)","sent","Urutan aksi → past simple."),
xq("While I cooked, the phone was ringing and I answered it.","While I was cooking, the phone rang and I answered it.","Latar = continuous, kejadian = simple."),
oq("While we were walking, it started to rain."),
wq("Write 2 sentences: one with an action in progress interrupted by another, and one with a sequence of finished actions.","past simple vs past continuous")]},

{id:"c3",topic:"tenses",fam:"compare",lv:"A2",tag:"core",et:"tense",t:"Will vs Going to",g:"Spontaneous decisions versus plans and evidence.",
ex:"**be going to**: rencana yang sudah diputuskan, atau prediksi berdasarkan bukti yang terlihat sekarang (dark clouds → It is going to rain).\n**will**: keputusan spontan saat bicara, janji, tawaran, dan prediksi berdasarkan pendapat (I think …).\n**Tes cepat**: sudah direncanakan sebelum bicara? → going to. Diputuskan saat itu juga? → will.\n*I've booked the flight. I'm going to visit Japan in May.* / *The phone is ringing! I'll get it.*",
ph:[["I'm going to visit Japan in May.","Saya akan mengunjungi Jepang bulan Mei."],["The phone is ringing. I'll get it.","Telepon berdering. Biar saya angkat."],["Look at those clouds. It's going to rain.","Lihat awan itu. Akan hujan."],["I think she'll love the gift.","Saya kira dia akan suka hadiahnya."]],
q:[mq("I've already booked the flight. I ____ visit Japan in May.",["am going to","will to","go to"],0,"Sudah direncanakan → going to."),
mq("The phone is ringing! I ____ get it.",["will","am going to been","was"],0,"Keputusan spontan → will."),
mq("Look at those black clouds! It ____ rain.",["is going to","did","has"],0,"Ada bukti sekarang → going to."),
fq("I think she ____ the gift. (love)","will love|'ll love","Pendapat → will."),
fq("We ____ a baby in June. We're so excited! (have)","are going to have|'re going to have","Rencana pasti → going to."),
xq("Don't worry, I going to help you.","Don't worry, I'll help you.|Don't worry, I will help you.|Don't worry, I'm going to help you.","Perlu am / will: I'm going to atau I'll."),
oq("We are going to visit Bali in June."),
wq("Write 2 sentences: one plan you have already made (going to) and one spontaneous offer (will).","will vs going to")]},

{id:"c4",topic:"tenses",fam:"compare",lv:"B1",tag:"core",et:"tense",t:"Present Perfect vs Present Perfect Continuous",g:"Results and numbers versus duration and process.",
ex:"**Present perfect**: fokus pada **hasil atau jumlah**. *I have written three emails.* (How many?)\n**Present perfect continuous**: fokus pada **durasi atau proses**. *I have been writing emails all morning.* (How long?)\n**Tes cepat**: ada jumlah (three, many, how many)? → present perfect. Ada durasi (all morning, how long)? → continuous.\nStative verb (know, have, like) selalu present perfect: ✗ I have been knowing. ✓ I have **known**.",
ph:[["I've written three emails this morning.","Saya sudah menulis tiga email pagi ini."],["I've been writing emails all morning.","Saya menulis email sepanjang pagi."],["How many reports have you finished?","Berapa laporan yang sudah kamu selesaikan?"],["How long have you been waiting?","Sudah berapa lama kamu menunggu?"]],
q:[mq("How many emails ____ you ____ today?",["have / sent","have / been sending","did / been send"],0,"How many → hasil / jumlah."),
mq("How long ____ you ____ English?",["have / been learning","did / learning","are / learn"],0,"How long → durasi."),
mq("I ____ the report. Here it is.",["have finished","have been finishing","am finishing"],0,"Hasil selesai → present perfect."),
fq("I ____ this book for two hours. (read)","have been reading|'ve been reading","for two hours → durasi."),
fq("She ____ five emails so far. (write)","has written|'s written","five emails → jumlah."),
xq("I have been knowing him for years.","I have known him for years.","know = stative."),
oq("How long have you been waiting?"),
wq("Write 2 sentences: one about how many things you have done today and one about how long you have been doing something.","present perfect vs continuous")]},

{id:"c5",topic:"tenses",fam:"compare",lv:"B1",tag:"core",et:"tense",t:"Used to vs Would vs Past Simple",g:"Talk about past habits and states.",
ex:"**used to + V1**: kebiasaan **atau keadaan** lampau yang sudah tidak berlaku. *I used to live in Jakarta.*\n**would + V1**: kebiasaan berulang di masa lalu, **bukan untuk keadaan**. *Every summer we would go to the beach.* ✗ I would live in Jakarta.\n**Past simple**: kejadian tertentu yang selesai. *We went to the beach last summer.*\n**Negatif**: didn't **use** to (bukan didn't used to). Tanya: Did you **use** to …?",

function migrate(){
  if(!Array.isArray(S.history))S.history=[];

  const seen=new Set(S.history.map(h=>h.kind+":"+(h.ref||"")));
  (S.writings||[]).forEach(w=>{
    if(!w.id||seen.has("write:"+w.id))return;
    S.history.push({id:uid(),ts:(w.date||today())+"T12:00:00.000Z",date:w.date||today(),kind:"write",title:String(w.text||"").slice(0,90),detail:w.type||"",ref:w.id});

async function callAI(p,system,user,opt){opt=opt||{};
  if(!p||!p.key||!p.model||!p.url)throw new Error("Finish setting up a provider in Settings: URL, key, and model ID.\nLengkapi provider di Pengaturan.");
  const ck=hash(p.model+"|"+system+"|"+user);const cache=loadCache();
  if(!opt.noTrack&&cache[ck])return {text:cache[ck].v,cached:true};
  if(!opt.noTrack&&p.limit&&usedToday(p)>=p.limit)throw new Error('Daily limit reached for "'+p.name+'" ('+p.limit+"). Pick another model or change the limit in Settings.\nBatas harian tercapai. Pilih model lain atau ubah batas di Pengaturan.");
  let text="";
  if(p.format==="gemini"){
    const url=p.url.replace(/\/$/,"")+"/models/"+encodeURIComponent(p.model)+":generateContent?key="+encodeURIComponent(p.key);
    const body={systemInstruction:{parts:[{text:system}]},contents:[{role:"user",parts:[{text:user}]}],generationConfig:{temperature:opt.temp!=null?opt.temp:0.3,maxOutputTokens:opt.max||4096,responseMimeType:opt.json?"application/json":undefined}};
    let res;try{res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})}catch(e){throw new Error(NETERR)}
    let data={};try{data=await res.json()}catch(e){}
    if(!res.ok)throw new Error(errMsg(res.status,data));
    text=((data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts)||[]).map(x=>x.text||"").join("");
    if(!text)throw new Error("The AI returned no text"+(data.candidates&&data.candidates[0]&&data.candidates[0].finishReason?" ("+data.candidates[0].finishReason+")":"")+". Try again.");
  }else{
    const url=p.url.replace(/\/$/,"")+"/chat/completions";
    const body={model:p.model,messages:[{role:"system",content:system},{role:"user",content:user}],temperature:opt.temp!=null?opt.temp:0.3,max_tokens:opt.max||4096};
    let res;try{res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+p.key},body:JSON.stringify(body)})}catch(e){throw new Error(NETERR)}
    let data={};try{data=await res.json()}catch(e){}
    if(!res.ok)throw new Error(errMsg(res.status,data));
    text=(data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content)||"";
    if(!text)throw new Error("The AI returned no text. Try again.");
  }
  if(!opt.noTrack){bump(p);save();let ok=true;if(opt.validate){try{opt.validate(text)}catch(e){ok=false}}if(ok){cache[ck]={t:Date.now(),v:text};saveCache(cache)}}

let ownTheme=false;

function updateWc(){const el=$("#wc"),ta=$("#draft");if(!el||!ta)return;const words=(ta.value.trim().match(/\S+/g)||[]).length;el.textContent=words?pl(words,"word"):"Nothing written yet"}

function weekHTML(){const keys=weekKeys();const labels=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];const scores=keys.map(dayScore);const mx=Math.max(1,...scores);return `<div class="wbars">${scores.map((n,i)=>{const h=n?Math.max(8,Math.round(n/mx*72)):4;const cls=keys[i]===today()?" today":"";return `<div class="wcol${cls}"><i style="height:${h}px"></i><span>${labels[i]}</span></div>`}).join("")}</div>`}
function heatHTML(){
  const now=new Date();const dow=(now.getDay()+6)%7;const start=new Date(now.getFullYear(),now.getMonth(),now.getDate()-dow-15*7);let cells="";
  for(let i=0;i<16*7;i++){const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);const key=dstr(d);const fut=key>today();const n=fut?0:dayScore(key);cells+=`<i class="lv${fut?0:heatLevel(n)}${fut?" fut":""}" title="${esc(fut?key:key+": "+pl(n,"activity").replace("activitys","activities"))}"></i>`}
  return `<div class="heatwrap"><div class="heatdays"><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span><span>Sun</span></div><div class="heat">${cells}</div></div><div class="legend"><span>Less</span><i class="lv0"></i><i class="lv1"></i><i class="lv2"></i><i class="lv3"></i><i class="lv4"></i><span>More</span></div>`;
}
function errorHTML(){const es=Object.entries(S.errorStats||{}).sort((a,b)=>b[1]-a[1]);if(!es.length)return "";const mx=Math.max(1,...es.map(e=>e[1]));return es.map(e=>`<div class="erow"><div class="erowtop"><span>${esc(ERR_LABEL[e[0]]||e[0])}</span><b>${e[1]}</b></div><div class="ebar"><i style="width:${Math.round(e[1]/mx*100)}%"></i></div></div>`).join("")}

  return `<div class="card">${r.cached?'<span class="pill">from saved results · no new request</span>':""}
  <div class="cmp"><div><h4 style="margin-top:8px">Your writing</h4><div class="ans">${esc(r.text||"")}</div></div><div><h4 style="margin-top:8px">Corrected version</h4><div class="ans">${esc(d.corrected)}</div><button class="btn ghost sm" data-act="say" data-k="corrected">${IC.vol} Listen</button></div></div>
  ${d.natural?`<h4>More natural</h4><div class="ans">${esc(d.natural)}</div><button class="btn ghost sm" data-act="say" data-k="natural">${IC.vol} Listen</button>`:""}
  ${d.suggested?`<h4>Suggested answer${r.topic?" for this topic":""}</h4><div class="ans">${esc(d.suggested)}</div>${d.suggested_id?`<small>${esc(d.suggested_id)}</small>`:""}<div class="row" style="margin-top:8px"><button class="btn ghost sm" data-act="say" data-k="suggested">${IC.vol} Listen</button><button class="btn ghost sm" data-act="useSuggested">Copy to my writing</button></div>`:""}
  ${d.errors.length?`<h4>Main mistakes</h4><small>Saved automatically to your <a href="#" data-act="openNotes">Mistake notebook</a>.</small>${d.errors.map((e,i)=>`<div class="err"><div><span class="w">${esc(e.wrong)}</span> → <span class="r">${esc(e.right)}</span> <span class="pill">${esc(ERR_LABEL[e.type]||e.type||"")}</span></div><small>${esc(e.why||"")}</small><div style="margin-top:8px"><button class="btn ghost sm" data-act="saveErr" data-i="${i}" ${r.saved["e"+i]?"disabled":""}>${r.saved["e"+i]?"Saved":"Make a card"}</button></div></div>`).join("")}`:'<p class="w-ok">No major mistakes.</p>'}
  ${d.vocab.length?`<h4>Useful phrases</h4>${d.vocab.map((v,i)=>`<div class="phrase"><div class="grow"><b class="en">${esc(v.front)}</b><small>${esc(v.back)}</small></div><button class="btn ghost sm" data-act="say" data-t="${esc(v.front)}" aria-label="Listen">${IC.vol}</button><button class="btn ghost sm" data-act="saveVocab" data-i="${i}" ${r.saved["v"+i]?"disabled":""}>${r.saved["v"+i]?"Saved":"Save"}</button></div>`).join("")}`:""}
  ${d.interview?`<h4>Interview feedback</h4><div class="ans">${esc(d.interview)}</div>`:""}
  ${d.tip?`<h4>Tip</h4><p>${esc(d.tip)}</p>`:""}
  ${(d.errors.length||d.vocab.length)?`<div style="margin-top:14px"><button class="btn block" data-act="saveAll" ${savedAll?"disabled":""}>${savedAll?"All saved as cards":"Save all as cards"}</button></div>`:""}</div>`;

function cardListHTML(){
  const f=ui.cfilter,q=(ui.cquery||"").trim().toLowerCase();
  const list=S.cards.filter(c=>(f==="all"||c.tag===f)&&(!q||(c.front+" "+c.back+" "+(c.example||"")).toLowerCase().includes(q)));
  if(!list.length)return '<p class="muted">No cards match this filter.</p>';
  return list.slice(0,120).map(c=>`<div class="phrase"><div class="grow"><b class="en">${c.kind==="fix"?"Fix: ":""}${esc(c.front)}</b><small>${esc(c.back).replace(/\n/g," · ")}</small></div><span class="pill">${c.box}</span><button class="btn ghost sm" data-act="delCard" data-id="${c.id}" aria-label="Delete card">Delete</button></div>`).join("")+(list.length>120?`<small>Showing 120 of ${list.length}.</small>`:"");
}

function commitReview(rv){if(!rv||rv.logged||!rv.done)return;rv.logged=true;const s=rv.stats;logEvent({kind:"review",title:"Reviewed "+pl(rv.unique,"card"),detail:s.good+" got it · "+s.hard+" hard · "+s.again+" forgot"})}
function reviewHTML(){
  const rv=ui.rv;const c=cardById(rv.queue[rv.i]);
  if(!c){commitReview(rv);const s=rv.stats;return `<section class="card" style="text-align:center;padding:28px 18px"><p class="kicker">Done</p><h2>${pl(rv.unique,"card")}</h2><p class="muted">${s.good} got it · ${s.hard} hard · ${s.again} forgot</p><button class="btn" data-act="endReview">Back to cards</button></section>`}
  const left=rv.queue.length-rv.i;const front=c.kind==="fix"?"Fix this sentence:\n"+c.front:c.front;
  const hint=r=>{const n=nextState(c,r);return n.days===0?"again today":"+"+pl(n.days,"day")};
  const pct=Math.round(rv.i/Math.max(1,rv.i+left)*100);
  return `<div class="row" style="justify-content:space-between"><button class="btn ghost sm" data-act="endReview">Exit</button><span class="pill">${left} left</span></div><div class="prog"><i style="width:${pct}%"></i></div>
  <div class="fc"><div class="t">${esc(tagName(c.tag))}${c.kind==="fix"?" · correction":""}</div><div class="f">${esc(front)}</div>
  ${rv.shown?`<div class="b">${esc(c.back)}</div>${c.example?`<small style="margin-top:8px">${esc(c.example)}</small>`:""}`:'<small style="margin-top:12px">Say it out loud first, then check the answer.</small>'}</div>
  ${c.say?`<div style="text-align:center"><button class="btn ghost sm" data-act="say" data-t="${esc(c.say)}">${IC.vol} Listen</button></div>`:""}
  ${rv.shown?`<div class="rate"><button class="btn danger" data-act="rate" data-v="again">Forgot<small>${hint("again")}</small></button><button class="btn ghost" data-act="rate" data-v="hard">Hard<small>${hint("hard")}</small></button><button class="btn" data-act="rate" data-v="good">Got it<small>${hint("good")}</small></button></div><p class="keys muted">Space to reveal · 1 forgot · 2 hard · 3 got it</p>`:`<button class="btn block" style="margin-top:10px" data-act="flip">Show answer</button><p class="keys muted">Press space</p>`}`;
}


/* ---- buku kesalahan ---- */
function noteKey(e){return (String(e.wrong).trim()+"|"+String(e.right).trim()).toLowerCase()}
function addNotes(errors,date){if(!Array.isArray(S.notebook))S.notebook=[];const seen=new Set(S.notebook.map(noteKey));let n=0;(errors||[]).forEach(e=>{if(!e||!e.wrong||!e.right)return;const k=noteKey(e);if(seen.has(k))return;seen.add(k);S.notebook.unshift({id:uid(),date:date||today(),wrong:String(e.wrong).trim(),right:String(e.right).trim(),why:String(e.why||"").trim(),type:e.type||"other"});n++});if(S.notebook.length>300)S.notebook.length=300;return n}
function migrateNotes(){if(S.notesMigrated)return;if(!Array.isArray(S.notebook))S.notebook=[];(S.writings||[]).slice().reverse().forEach(w=>addNotes((w.data||{}).errors,w.date));S.notesMigrated=true;save()}
function notesHTML(){
  const all=S.notebook||[];
  const types=[...new Set(all.map(n=>n.type||"other"))];
  if(ui.nfilter!=="all"&&!types.includes(ui.nfilter))ui.nfilter="all";
  const list=all.filter(n=>ui.nfilter==="all"||(n.type||"other")===ui.nfilter);
  const hasCard=n=>S.cards.some(c=>c.kind==="fix"&&String(c.front).toLowerCase()===n.wrong.toLowerCase());
  const intro=all.length?`<p class="muted">${pl(all.length,"mistake")} saved automatically from AI corrections and dictation. Open this anytime to review them, then press X to delete the ones you have mastered.</p>`:"";
  const seg=types.length>1?`<div class="seg"><button class="${ui.nfilter==="all"?"on":""}" data-act="nfilter" data-v="all">All</button>${types.map(t=>`<button class="${ui.nfilter===t?"on":""}" data-act="nfilter" data-v="${esc(t)}">${esc(ERR_LABEL[t]||t)}</button>`).join("")}</div>`:"";
  if(!all.length)return `<div class="card"><h3>No mistakes saved yet</h3><p class="muted">Every time the AI corrects your writing, the mistakes are saved here automatically. You do not need to save them one by one.</p><button class="btn" data-act="go" data-p="write">Write something</button></div>`;
  return intro+seg+`<div class="card">${list.map(n=>`<div class="nrow">
    <div><div class="nline"><span class="nw">${esc(n.wrong)}</span><span class="narrow" aria-hidden="true">→</span><span class="nr">${esc(n.right)}</span></div>${n.why?`<small>${esc(n.why)}</small>`:""}<small class="nmeta">${esc(ERR_LABEL[n.type]||n.type||"Other")} · ${esc(niceDate(n.date))}</small></div>
    <div class="nact"><button class="iconbtn sm" data-act="say" data-t="${esc(n.right)}" aria-label="Listen to the correct version">${IC.vol}</button><button class="iconbtn sm nx" data-act="delNote" data-id="${n.id}" aria-label="Delete from mistake notebook">${IC.x}</button></div>
    <div class="nfoot"><button class="btn ghost sm" data-act="noteCard" data-id="${n.id}" ${hasCard(n)?"disabled":""}>${hasCard(n)?"Already a card":"Make a card"}</button></div>
  </div>`).join("")}</div>`;
}
function quizHTML(){
  const form=`<div class="card"><h3>Make a quiz from a text</h3><p class="muted">Paste a reading or transcript. One request makes one set you can redo.</p>
  <div class="row"><div class="grow"><label style="margin-top:0">Level</label><select id="qlevel">${["A1","A2","A2–B1","B1","B1–B2","B2"].map(x=>`<option ${ui.qlevel===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="grow"><label style="margin-top:0">Questions</label><select id="qn">${["5","8","10"].map(x=>`<option ${ui.qn===x?"selected":""}>${x}</option>`).join("")}</select></div></div>
  <label>Topic</label><select id="qcat"><option value="umum" ${ui.qcat==="umum"?"selected":""}>General</option><option value="kerja" ${ui.qcat==="kerja"?"selected":""}>Work</option><option value="VA" ${ui.qcat==="VA"?"selected":""}>VA</option></select>
  <label>Text or transcript</label><textarea id="qsrc" placeholder="Paste it here...">${esc(ui.quizSrc)}</textarea>
  ${modelSelect()}
  <div style="margin-top:12px"><button class="btn block" data-act="quizGen">Make a quiz with AI</button></div></div>`;
  const hist=S.quizzes.length?`<h4>Saved quizzes</h4><div class="card">${S.quizzes.slice(0,8).map((x,i)=>`<button class="item" data-act="quizOpen" data-i="${i}"><span class="grow"><b>${esc((x.data&&x.data.title)||"Quiz")}</b><small>${esc(niceDate(x.date))} · ${pl((x.data.questions||[]).length,"question")}</small></span><span class="chev">›</span></button>`).join("")}</div>`:"";
  return form+`<div id="quizBox">${ui.quiz?quizBoxHTML():""}</div>`+hist;
}
function quizBoxHTML(){const q=ui.quiz,d=q.data;const done=Object.keys(q.ans).length;const correct=Object.values(q.ans).filter(a=>a.ok).length;
  return `<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${esc(d.title||"Quiz")}</h3><span class="pill">${correct}/${done} correct · ${pl(d.questions.length,"question")}</span></div>
  ${d.questions.map((x,i)=>qHTML(x,i,q)).join("")}
  ${done?`<div class="row" style="margin-top:12px"><button class="btn ghost sm" data-act="quizSaveWrong">Save wrong answers as cards</button></div>`:""}
  ${d.vocab&&d.vocab.length?`<h4>Phrases from the text</h4>${d.vocab.map((v,i)=>`<div class="phrase"><div class="grow"><b class="en">${esc(v.front)}</b><small>${esc(v.back)}</small></div><button class="btn ghost sm" data-act="say" data-t="${esc(v.front)}" aria-label="Listen">${IC.vol}</button><button class="btn ghost sm" data-act="quizVocab" data-i="${i}">Save</button></div>`).join("")}`:""}</div>`;
}
function qHTML(x,i,q){const a=q.ans[i];let inner="";
  if(x.type==="mcq"){inner=(x.options||[]).map((o,j)=>{let cls="";if(a){if(j===+x.answer)cls="good";else if(j===a.v)cls="bad"}return `<button class="opt ${cls}" data-act="qa" data-i="${i}" data-v="${j}" ${a?"disabled":""}>${esc(o)}</button>`}).join("")}
  else if(x.type==="tf"){inner=[[true,"True"],[false,"False"]].map(o=>{let cls="";if(a){if(o[0]===x.answer||String(o[0])===String(x.answer))cls="good";else if(o[0]===a.v)cls="bad"}return `<button class="opt ${cls}" data-act="qa" data-i="${i}" data-v="${o[0]}" ${a?"disabled":""}>${o[1]}</button>`}).join("")}
  else{const dv=q.draft[i]||"";inner=a?`<div class="opt ${a.ok?"good":"bad"}">${esc(a.v)}</div>${a.ok?"":`<div class="opt good">${esc(x.answer)}</div>`}`:`<div class="row"><input data-fill="${i}" value="${esc(dv)}" placeholder="Your answer" lang="en" style="flex:1"><button class="btn sm" data-act="qf" data-i="${i}">Check</button></div>`}
  return `<div class="q"><b>${i+1}. ${esc(x.q)}</b>${inner}${a?`<div class="why">${a.ok?"Correct. ":"Not quite. "}${esc(x.why||"")}</div>`:""}</div>`;
}
function dictHTML(){if(!ui.dict)pickDict();const d=ui.dict;
  let res="";if(d.res){res=`<div class="card"><p class="${d.res.score===d.res.total?"w-ok":""}">${d.res.score} of ${d.res.total} words correct</p><p>${d.res.words.map((w,i)=>`<span class="${d.res.ok[i]?"w-ok":"w-bad"}">${esc(w)}</span>`).join(" ")}</p><div class="ans">${esc(d.t)}</div><div class="row"><button class="btn ghost sm" data-act="say" data-t="${esc(d.t)}">${IC.vol} Hear the sentence</button><button class="btn ghost sm" data-act="dictSave">Save as a card</button></div><small>Green means correct. Red means missed or wrong.</small></div>`}
  return `<div class="card"><h3>Dictation</h3><p class="muted">Listen, then type. Uses no AI quota.</p>
  <div class="row"><button class="btn" data-act="dictPlay">${IC.vol} Play</button><button class="btn ghost" data-act="dictSlow">Slow</button><button class="btn ghost" data-act="dictNext">Another sentence</button></div>
  <label>What you heard</label><textarea id="dans" lang="en" spellcheck="false" style="min-height:90px"></textarea>
  <div style="margin-top:10px"><button class="btn block" data-act="dictCheck">Check answer</button></div></div>${res}`;

function diffWords(target,ans){const expand=s=>s.toLowerCase().replace(/[\u2019\u2018`]/g,"'").replace(/\bwon't\b/g,"will not").replace(/\bcan't\b/g,"can not").replace(/\blet's\b/g,"let us").replace(/n't\b/g," not").replace(/'re\b/g," are").replace(/'ve\b/g," have").replace(/'ll\b/g," will").replace(/'m\b/g," am").replace(/\b(it|that|what|there|here|he|she|who|where|how)'s\b/g,"$1 is");
  const norm=s=>expand(s).replace(/[^a-z0-9' ]/g," ").split(/\s+/).filter(Boolean);const a=norm(target),b=norm(ans);const n=a.length,m=b.length;const dp=Array.from({length:n+1},()=>Array(m+1).fill(0));for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);const ok=Array(n).fill(false);let i=0,j=0;while(i<n&&j<m){if(a[i]===b[j]){ok[i]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}return {words:a,ok,score:ok.filter(Boolean).length,total:n}}

const SPELLMAP={colour:"color",colours:"colors",favourite:"favorite",favourites:"favorites",centre:"center",behaviour:"behavior",programme:"program",travelling:"traveling",travelled:"traveled",traveller:"traveler",cancelled:"canceled",grey:"gray",whilst:"while",okay:"ok",enrol:"enroll",neighbour:"neighbor",labour:"labor",honour:"honor",judgement:"judgment",catalogue:"catalog",dialogue:"dialog",cheque:"check"};
const NUMW=["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const TENSW=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
const ORDW=["","first","second","third","fourth","fifth","sixth","seventh","eighth","ninth","tenth"];
function numWord(n){if(n<20)return NUMW[n];if(n<100)return TENSW[Math.floor(n/10)]+(n%10?" "+NUMW[n%10]:"");if(n===100)return "one hundred";return null}
function canonBase(s){
  s=String(s).toLowerCase().replace(/[‘’ʼ`´]/g,"'");
  s=s.replace(/(\d),(?=\d{3}\b)/g,"$1").replace(/%/g," percent ").replace(/&/g," and ");
  s=s.replace(/\bwon't\b/g,"will not").replace(/\bcan't\b/g,"can not").replace(/\bcannot\b/g,"can not").replace(/\bshan't\b/g,"shall not").replace(/\bain't\b/g,"is not");
  s=s.replace(/n't\b/g," not").replace(/'re\b/g," are").replace(/'ve\b/g," have").replace(/'ll\b/g," will").replace(/'m\b/g," am").replace(/\blet's\b/g,"let us");
  return s}
function variants(s){
  let outs=[canonBase(s)];
  const expand=(re,reps)=>{for(let k=0;k<3;k++){let ch=false;const res=[];outs.forEach(v=>{if(re.test(v)){ch=true;reps.forEach(r=>res.push(v.replace(re,r)))}else res.push(v)});outs=res;if(!ch||outs.length>40)break}};
  expand(/\b([a-z]+)'s\b/,["$1 is","$1 has","$1~s"]);
  expand(/\b([a-z]+)'d\b/,["$1 would","$1 had"]);
  const fin=v=>{
    v=v.replace(/'/g,"").replace(/-/g," ").replace(/[^a-z0-9~ ]/g," ");
    v=v.replace(/\b(\d{1,2})(st|nd|rd|th)\b/g,(m,n)=>ORDW[+n]||m);
    v=v.replace(/\b(\d{1,3})\b/g,(m,n)=>numWord(+n)||m);
    v=v.replace(/\be mail\b/g,"email");
    v=v.replace(/\b(summar|organ|real|apolog|priorit|recogn|special|minim|emphas|visual|final|critic|categor|memor|personal|author|capital|stabil|util|custom)is(e|es|ed|ing|ation|ations)\b/g,"$1iz$2");
    v=v.replace(/\b[a-z]+\b/g,w=>SPELLMAP[w]||w);
    return v.replace(/\s+/g," ").trim()};
  return Array.from(new Set(outs.map(fin)))}
function sameAns(a,b){const A=variants(a),B=new Set(variants(b));return A.some(x=>B.has(x))}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function oneTypo(a,b){const wa=variants(a)[0].split(" "),wb=variants(b)[0].split(" ");if(wa.length!==wb.length)return null;const d=[];wa.forEach((w,i)=>{if(w!==wb[i])d.push(i)});if(d.length!==1)return null;const x=wa[d[0]],y=wb[d[0]];return x.length>=6&&y.length>=6&&lev(x,y)===1?y:null}
function splitBlank(q){const m=stripHint(q).match(/^([\s\S]*?)_{3,}([\s\S]*)$/);return m?[m[1],m[2]]:["",""]}
function fullAnswer(it,right){if(it.t==="f"){const [a,b]=splitBlank(it.q);return (a+right+b).replace(/\s+/g," ").trim()}return right}
function gradeItem(it,given,idx){
  if(it.t==="w")return {ok:null,pending:true,given:given||""};
  if(given==null)return {ok:false,given:"",skipped:true};
  const acc=S.accepted[it.k]||[];
  const accHit=cand=>acc.length&&variants(cand).some(v=>acc.indexOf(v)>=0);
  if(it.t==="m"){if(idx===it.a||accHit(given))return {ok:true,given};return {ok:false,given}}
  const keys=accList(it.a);let cands=[],full=[];
  if(it.t==="f"){const [pre,post]=splitBlank(it.q);full=keys.map(k=>pre+k+post);cands=[pre+given+post,given];
    const pw=pre.trim().split(/\s+/),last=pw[pw.length-1];
    if(last&&given.length>last.length&&given.toLowerCase().indexOf(last.toLowerCase())===0){const cut=pre.lastIndexOf(last);cands.push(pre.slice(0,cut)+given+post)}}
  else{cands=[given];full=keys}
  for(const c of cands){for(const f of full){if(sameAns(c,f))return {ok:true,given}}if(accHit(c))return {ok:true,given,self:true}}
  for(const c of cands){for(const f of full){const ty=oneTypo(c,f);if(ty)return {ok:true,given,note:"Almost: check the spelling of \""+ty+"\"."}}}
  if(it.t==="f"&&given.split(/\s+/).length===1){for(const k of keys){if(k.length>=6&&lev(variants(given)[0],variants(k)[0])===1)return {ok:true,given,note:"Almost: check the spelling of \""+k+"\"."}}}
  return {ok:false,given}}

function validItem(x){
  if(!x||typeof x!=="object")return null;const t=x.t;
  if(t==="m"){if(!x.q||!Array.isArray(x.o))return null;const o=x.o.map(String);if(o.length<2||o.length>4||new Set(o.map(s=>s.toLowerCase().trim())).size!==o.length)return null;const a=+x.a;if(!(Number.isInteger(a)&&a>=0&&a<o.length))return null;return {t:"m",q:String(x.q),o,a,w:String(x.w||"")}}

function wsItemHTML(W,wh,it,i){

function buildHW(C,aiItems){

  ws.forEach(t=>items.push({t:"w",q:t,target:""}));

function parseTutor(raw){raw=String(raw||"");let reply=raw,d={};const i=raw.indexOf("<<<DATA>>>");
  if(i>=0){reply=raw.slice(0,i);d=parseJSON(raw.slice(i+10))||{}}
  else if(/^\s*(```|\{)/.test(raw)){const j=parseJSON(raw);if(j&&typeof j.reply==="string"){reply=j.reply;d=j}}
  reply=reply.replace(/^\s*```\w*\s*/,"").replace(/\s*```\s*$/,"").trim();return {reply,d}}
function memoryText(){const p=S.profile,L=[];

  L.push("Interests: "+p.mods.map(m=>(MODS.find(x=>x[0]===m)||[0,m])[1]).join(", "));
  const done=ALLL().filter(isDone).map(u=>u.t);if(done.length)L.push("Lessons completed in the app: "+done.slice(-8).join("; "));
  const weakU=ALLL().filter(u=>S.unitProg[u.id]&&!S.unitProg[u.id].done&&S.unitProg[u.id].last!=null).map(u=>u.t+" ("+S.unitProg[u.id].last+"%)");
  if(weakU.length)L.push("Lessons not passed yet: "+weakU.join("; "));
  const es=Object.entries(S.errorStats||{}).sort((a,b)=>b[1]-a[1]).slice(0,5).map(e=>(ERR_LABEL[e[0]]||e[0])+" x"+e[1]);
  if(es.length)L.push("Most frequent error types in the app: "+es.join(", "));
  const nb=(S.notebook||[]).filter(n=>n.type!=="dictation").slice(0,6).map(n=>n.wrong+" -> "+n.right);
  if(nb.length)L.push("Recent mistakes: "+nb.join(" | "));
  const weak=S.cards.filter(c=>(c.lapses||0)>=2&&c.kind!=="fix").slice(0,8).map(c=>c.front);
  if(weak.length)L.push("Phrases the student often forgets: "+weak.join(" | "));

async function chatTurn(area,text){
  const C=area==="talk"?S.talk:S.ask;if(!C||ui.cb[area])return;
  ui.cb[area]=true;ui.ce[area]="";if(text!=null)C.msgs.push({r:"user",t:text});render();

    const sys=area==="talk"?talkSys(PERSONAS.find(x=>x[0]===C.persona)||PERSONAS[0]):askSys(C.lesson?lessonById(C.lesson):null);
    const raw=await aiCall(area==="talk"?"talk":"learn",sys,chatUser(C,text==null,area),{max:3000,temp:0.8});
    const pr=parseTutor(raw),d=pr.d;if(!pr.reply)throw new Error("The tutor returned an empty reply. Try again.");
    const errs=cleanErrs(d.errors);
    const vocab=(Array.isArray(d.vocab)?d.vocab:[]).filter(v=>v&&v.front&&v.back).slice(0,2).map(v=>({front:String(v.front),back:String(v.back),example:String(v.example||"")}));
    C.msgs.push({r:"ai",t:pr.reply,errs,vocab});
    errs.forEach(e=>{S.errorStats[e.type]=(S.errorStats[e.type]||0)+1;(C.errs=C.errs||[]).push(e)});
    if(errs.length)addNotes(errs,today());

    mark();save();

    if(text!=null){C.msgs.pop();ui.cd[area]=text}else if(!C.msgs.length){if(area==="talk")S.talk=null;else S.ask=null}
    save()}
  ui.cb[area]=false;render()}

function localTalkSummary(T){const id=explLang()==="id",p=S.profile;

async function talkFinish(){

    const txt=await aiCall("talk",sys,"TRANSCRIPT\n"+T.msgs.map(m=>(m.r==="user"?"Student: ":"Partner: ")+m.t).join("\n")+"\n\nERRORS ALREADY LOGGED\n"+((T.errs||[]).map(e=>e.wrong+" -> "+e.right).join("\n")||"none"),{json:true,max:2500,temp:0.4});
    out=parseJSON(txt);
  }catch(e){ui.ce.talk=e.message}
  const ai=!!(out&&out.summary);
  const sess={id:uid(),date:today(),summary:ai?String(out.summary):localTalkSummary(T),homework:"",n,mode:"talk"};
  S.sessions.unshift(sess);S.sessions=S.sessions.slice(0,30);

  S.talk=null;ui.tsum=sess;ui.cb.talk=false;save();render();window.scrollTo(0,0);

  <section class="card"><h3>Tutor memory</h3><p class="muted">The tutor reads this in every Learn session and Ask chat (up to about 7,000 characters). It updates when you finish a Learn session, and the previous version is kept as a backup. You can paste a summary from an earlier course or chat here.</p><textarea id="setNotes" style="min-height:150px" placeholder="Paste a previous summary here">${esc(p.notes)}</textarea><div style="margin-top:8px"><button class="btn ghost sm" data-act="saveNotes">Save memory</button></div></section>
  ${S.flags.length?`<section class="card"><h3>Answers you marked as correct</h3><p class="muted">${pl(S.flags.length,"answer")} accepted so far. These are not checked by AI, so tell me if any looks wrong.</p>${S.flags.slice(-5).reverse().map(f=>`<small>${esc(f.q).slice(0,70)} → <b>${esc(f.ans)}</b></small>`).join("<br>")}</section>`:""}
  ${S.sessions.length?`<h4>Session summaries</h4><div class="card">${S.sessions.slice(0,10).map(s=>`<button class="item" data-act="sessOpen" data-id="${s.id}"><span class="grow"><b>${esc(niceDate(s.date))}</b><small>${s.mode==="talk"?"Talk feedback":"Learn session"} · ${pl(s.n,s.mode==="talk"?"message":"worksheet")}</small></span><span class="chev">›</span></button>`).join("")}</div>`:""}`}
function pgMe(){const tabs=[["profile","Profile"],["history","History"],["set","Settings"]];
  const body=ui.me==="history"?pgHistory():ui.me==="set"?pgSet():pgProfile();
  return `<h2>Me</h2><div class="seg">${tabs.map(t=>`<button class="${ui.me===t[0]?"on":""}" data-act="metab" data-v="${t[0]}">${t[1]}</button>`).join("")}</div>${body}`}
A.metab=(d)=>{ui.me=d.v;render();window.scrollTo(0,0)};
A.saveNotes=()=>{const el=$("#setNotes");S.profile.notes=(el?el.value:"").slice(0,8000);save();toast("Memory saved.")};

seedIfNeeded();migrate();migrateNotes();applyTheme();render();renderCover();
</script>
</body>
</html>
